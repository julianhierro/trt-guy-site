<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT Guy — Links</title>
<meta name="description" content="TRT Guy — all my links in one place.">
<meta property="og:title" content="TRT Guy — Links">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trt-guy.com/links/">
<meta property="og:image" content="https://trt-guy.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TRT Guy — Links">
<meta name="twitter:image" content="https://trt-guy.com/og-image.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#1a5cff; --acc-d:#0f3fd6; --bg:#f4f6fa; --card:#fff; --txt:#0b0d10; --mut:#5b6572;
    --line:rgba(11,13,16,.12);
    --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:var(--body);background:var(--bg);color:var(--txt);line-height:1.5;
    display:flex;flex-direction:column;align-items:center;padding:56px 20px 40px}
  .wrap{width:100%;max-width:440px;text-align:center}
  .wordmark{font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:.9;
    letter-spacing:.04em;text-transform:uppercase;display:inline-block}
  .links{margin-top:36px;display:flex;flex-direction:column;gap:14px}
  a.link{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;text-decoration:none;color:var(--txt);
    font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;
    box-shadow:0 1px 2px rgba(11,13,16,.05);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
  a.link:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(11,13,16,.10);border-color:var(--acc)}
  a.link .arw{color:var(--acc);font-size:22px;flex:0 0 auto}
  .foot{margin-top:40px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">TRT-GUY</div>

    <!-- Edit this list to add/remove links. Order = display order. -->
    <div class="links" id="links"></div>

    <div class="foot">© TRT Guy · Educational only — not medical advice</div>
  </div>

<script>
  var LINKS = [
    { label: 'TRT 101 Guide',        url: 'https://trt-guy.com/trt-101-guide/get/' },
    { label: 'Coaching Application', url: 'https://trt-guy.com/coaching-application/' }
    // { label: 'My Current Protocol', url: 'https://trt-guy.com/protocol/' }  // add once the page is filled in
  ];
  document.getElementById('links').innerHTML = LINKS.map(function(l){
    return '<a class="link" href="' + l.url + '"><span>' + l.label + '</span><span class="arw">&rarr;</span></a>';
  }).join('');

  // lightweight view beacon (same dashboard as the funnels)
  try {
    var vid = localStorage.getItem('tg-vid');
    if (!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('tg-vid', vid); }
    if (navigator.sendBeacon) navigator.sendBeacon('https://jv-dashboard-chi.vercel.app/api/pageview?p=trtguy-links&e=view&v=' + encodeURIComponent(vid));
  } catch (e) {}
</script>
</body>
</html>
