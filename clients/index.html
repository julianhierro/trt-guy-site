<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRT Guy — Clients</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f5f6;
    --line:#e7e7ea; --line-bright:#d5d5da;
    --fg:#0b0b0c; --muted:#5b5b63; --muted-2:#8a8a93;
    --accent:#0b0b0c; --accent-2:#000000; --accent-soft:rgba(11,13,16,.06);
    --good:#0b0b0c; --mid:#8a8a93; --bad:#0b0b0c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit}
  .mono{font-family:'JetBrains Mono',monospace}

  header.topbar{border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;position:sticky;top:0;background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);z-index:20}
  .brand{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.12em;font-size:13px;
    display:flex;align-items:center;text-decoration:none;color:var(--fg)}
  .brand .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:10px}
  .brand .slash{color:var(--muted-2);margin:0 6px}
  .topbar .right{display:flex;align-items:center;gap:10px}

  button{font-family:inherit}
  .btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;padding:10px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--line-bright);
    background:transparent;color:var(--muted);transition:all .14s}
  .btn:hover{color:var(--fg);border-color:var(--fg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.danger:hover{color:var(--bad);border-color:var(--bad)}
  .btn.sm{padding:7px 10px;font-size:9.5px}

  main{padding:26px 22px 90px;max-width:1280px;margin:0 auto}

  /* gate */
  .gate{max-width:420px;margin:16vh auto;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
  .gate h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .gate p{color:var(--muted-2);font-size:13.5px;margin:0 0 18px}
  input,select,textarea{background:var(--panel-2);border:1px solid var(--line-bright);border-radius:9px;color:var(--fg);
    padding:11px 12px;font:400 14.5px Inter,sans-serif;outline:0;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:110px;line-height:1.6}
  label.fl{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted-2);margin:0 0 6px;font-weight:700}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
  .stat{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px}
  .stat .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2)}
  .stat .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
  .stat .v small{font-size:14px;color:var(--muted-2);font-weight:600;letter-spacing:0}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .search{flex:1 1 220px;max-width:320px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    padding:8px 11px;border-radius:7px;border:1px solid var(--line-bright);background:transparent;
    color:var(--muted);cursor:pointer;font-weight:700}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  table{width:100%;border-collapse:collapse}
  thead th{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-2);text-align:left;padding:0 12px 10px;font-weight:700;white-space:nowrap}
  tbody tr{border-top:1px solid var(--line);cursor:pointer}
  tbody tr:hover{background:var(--panel)}
  tbody td{padding:14px 12px;font-size:13.5px;vertical-align:middle}
  .cname{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .curl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
  .csub{color:var(--muted-2);font-size:12.5px}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 8px;border-radius:5px;font-weight:700;border:1px solid var(--line-bright);color:var(--muted)}
  .pill.active{background:var(--fg);border-color:var(--fg);color:#fff}
  .pill.lead{background:var(--accent-soft);border-color:var(--line-bright);color:var(--fg)}
  .pill.paused{background:var(--panel-2);border-color:var(--line-bright);color:var(--muted)}
  .pill.ended{color:var(--muted-2)}
  .rowstatus{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line-bright);border-radius:6px;background:var(--panel-2);color:var(--fg);cursor:pointer}
  .rowstatus.st-active{background:var(--fg);border-color:var(--fg);color:#fff}
  .rowstatus.st-lead{background:var(--accent-soft)}
  .type{display:inline-block;font-size:12px;font-weight:600;color:var(--muted)}
  .left{font-size:12.5px;color:var(--muted)}
  .left.warn{color:var(--muted)}
  .left.over{color:var(--fg)}
  .cbcol{width:34px}
  .cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
  td.acts{white-space:nowrap;display:flex;gap:6px;justify-content:flex-end}
  .bulk{display:flex;align-items:center;gap:10px;border:1px solid rgba(11,13,16,.16);background:var(--accent-soft);
    border-radius:11px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;color:var(--fg)}
  .empty{border:1px dashed var(--line-bright);border-radius:14px;padding:40px;text-align:center;color:var(--muted-2)}

  /* detail panel */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:40}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--panel-2);
    border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column}
  .panel .phead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:flex-start;gap:14px}
  .panel .phead h2{margin:0;font-size:22px;letter-spacing:-.02em}
  .panel .ptabs{display:flex;gap:4px;padding:12px 22px 0;border-bottom:1px solid var(--line)}
  .ptab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 12px;border:0;background:transparent;color:var(--muted-2);cursor:pointer;font-weight:700;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .ptab.on{color:var(--fg);border-bottom-color:var(--accent)}
  .pbody{flex:1;overflow:auto;padding:20px 22px 30px}
  .pfoot{border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;
    justify-content:space-between;background:rgba(11,13,16,.03)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{margin-bottom:14px}
  .hint{color:var(--muted-2);font-size:12px;margin:6px 0 0}
  .sect{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;background:var(--panel)}
  .sect h3{margin:0;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .sect .shead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
  .sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw .track{width:38px;height:21px;border-radius:20px;background:var(--line-bright);border:1px solid var(--line-bright);
    position:relative;transition:.15s}
  .sw .track:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:.15s}
  .sw input:checked + .track{background:var(--accent-soft);border-color:var(--accent)}
  .sw input:checked + .track:after{left:19px;background:var(--accent)}
  .prog{border:1px solid var(--line-bright);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .pinbox{display:flex;align-items:center;gap:12px;border:1px solid rgba(11,13,16,.16);background:var(--accent-soft);
    border-radius:12px;padding:12px 15px;margin-bottom:16px;flex-wrap:wrap}
  .pinbox .code{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;letter-spacing:.28em}
  .pinbox p{margin:0;flex:1 1 180px;font-size:12.5px;color:var(--fg)}
  pre.transcript{white-space:pre-wrap;font:400 13px/1.65 'JetBrains Mono',monospace;color:var(--fg);
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0;overflow:auto}
  .rowlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .rowlist .r{display:flex;gap:8px;align-items:center}
  .draghandle{flex:0 0 auto;cursor:grab;color:var(--muted-2);font-size:16px;line-height:1;padding:0 4px;user-select:none}
  .draghandle:active{cursor:grabbing}
  .resrow.drop-hi{outline:2px dashed var(--accent);outline-offset:3px;border-radius:10px}
  a.openlink{flex:0 0 auto;text-decoration:none;padding:8px 11px}
  table.trk{width:100%;border-collapse:collapse;font-size:12.5px}
  table.trk th{font-size:9px;padding:0 7px 8px;text-align:right}
  table.trk th:first-child,table.trk td:first-child{text-align:left}
  table.trk tbody tr{border-top:1px solid var(--line)}
  table.trk tbody td{padding:9px 7px;text-align:right;white-space:nowrap;font-size:12.5px;vertical-align:top}
  table.trk tbody tr[data-wk]:hover{background:var(--panel-2)}
  table.trk.inner{background:var(--panel-2);border-radius:10px;margin:4px 0}
  table.trk.inner tbody tr{cursor:default}
  @media(max-width:760px){ table.trk thead{display:table-header-group} table.trk tbody tr{display:table-row;border:0;border-top:1px solid var(--line);margin:0;padding:0}
    table.trk tbody td{display:table-cell;padding:9px 7px} table.trk tbody td:before{display:none} }
  .trkqa{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:12px;white-space:normal;text-align:left}
  .trkqa .fl{margin:0}
  .trkqa p{margin:0 0 6px;font-size:13px;color:var(--fg);white-space:pre-wrap}
  .panel.wide{width:min(1240px,100%)}
  .sect.mday{margin-bottom:6px}
  .sect.mday.isrest{background:#e9f3e4;border-color:#b6d7a8}
  .dnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#000;color:#fff;font-size:11.5px;font-weight:800;flex:0 0 auto}
  .isrest .dnum{background:#6aa84f}
  .dtools{display:flex;gap:4px;align-items:center}
  .tlx.big{font-size:14px;padding:4px 7px;border:1px solid var(--line-bright);border-radius:7px;background:var(--panel)}
  .tlx:disabled{opacity:.3;cursor:default}
  table.meso td.mv2{white-space:nowrap;vertical-align:middle}
  .dins{display:flex;gap:6px;justify-content:center;margin:0 0 8px;opacity:.55;transition:opacity .15s}
  .dins:hover{opacity:1}
  .dins .tladd{border:1px dashed var(--line-bright);border-radius:7px;padding:5px 10px}
  .mgwrap{overflow:auto;border:1px solid #d9d9d9;border-radius:12px;background:#fff;max-height:78vh}
  table.mg{border-collapse:separate;border-spacing:0;font-size:12px;color:#000;font-family:Inter,system-ui,sans-serif}
  table.mg th,table.mg td{padding:6px 8px;border-bottom:1px solid #e3e3e3;white-space:nowrap;vertical-align:top}
  table.mg .c{text-align:center}
  table.mg thead th{position:sticky;top:0;z-index:3}
  table.mg thead tr:nth-child(2) th{top:31px}
  table.mg .mgtitle{background:#f3f3f3;text-align:left;font-weight:800;position:sticky;left:0;z-index:4}
  table.mg .mgprog{background:#f3f3f3;font-weight:800;letter-spacing:.04em;text-align:left}
  table.mg .mgw{font-weight:800;text-align:center;font-size:12.5px;border-left:1px solid rgba(0,0,0,.08)}
  table.mg .mgsp{background:#f3f3f3;min-width:6px;width:6px;padding:0;border-bottom-color:#f3f3f3}
  table.mg tr.mgday td{background:#000;color:#fff;font-weight:800}
  table.mg tr.mgday td.mgsess{font-weight:600;font-size:11px;white-space:nowrap}
  table.mg tr.mgday td.mgsess b{font-size:12px;margin-right:6px}
  table.mg tbody tr:not(.mgrest):not(.mggap) td:first-child{position:sticky;left:0;z-index:2;min-width:190px;max-width:230px;white-space:normal}
  table.mg .mgtitle2{background:#f3f3f3}
  /* per-set weight / reps cells */
  table.mg td.cw{background:#f7f7f7;min-width:38px;font-variant-numeric:tabular-nums;border-left:1px solid #e6e6e6}
  table.mg td.cr{min-width:30px;font-weight:700;font-variant-numeric:tabular-nums}
  table.mg tr.mgcols td.cw,table.mg tr.mgcols td.cr{font-size:9.5px;background:#d9d9d9}
  .sx{display:inline-flex;align-items:baseline;gap:3px;border:1px solid #d9d9d9;border-radius:6px;padding:1px 6px;margin:0 4px 3px 0;background:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sx i{font-style:normal;font-size:10px;color:#888}

  @media(max-width:520px){
    table.mg{font-size:11.5px}
    table.mg tbody tr:not(.mgrest):not(.mggap) td:first-child{min-width:128px;max-width:140px}
    table.mg th,table.mg td{padding:5px 6px}
  }
  /* one line per row — long text is cut with … (hover for the full text) */
  table.mg th,table.mg td{white-space:nowrap;line-height:1.3;padding:6px 8px}
  table.mg .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.mg tbody tr:not(.mgrest) td:first-child,table.mg .mgtitle{min-width:200px;max-width:200px;width:200px}
  table.mg tbody tr:not(.mgrest) td:first-child .cl{max-width:184px}
  table.mg td.mgres .cl{width:150px}
  table.mg td.mgnote .cl{width:110px;color:#444}
  table.mg td.mgsess .cl,table.mg tr.mgcn td .cl{max-width:330px}
  table.mg tr.mgcn td{white-space:nowrap}
  table.mg tr.mgrest td{padding:5px 10px}
  table.mg tr.mgcols td{padding:4px 8px}
  .mgprogline{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#555;margin:8px 2px 0}
  .mvwrap{overflow-x:auto;margin-top:14px}
  table.mv{border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid #d9d9d9;border-radius:10px;overflow:hidden}
  table.mv th,table.mv td{padding:6px 12px;white-space:nowrap;border-bottom:1px solid #eee;text-align:center}
  table.mv th:first-child,table.mv td:first-child{text-align:left;font-weight:700;background:#cccccc}
  table.mv th:first-child{background:#000;color:#fff}
  table.mv small{font-size:11px}
  table.mv small.ok{color:#2e7d32}
  table.mv small.low{color:#b26a00}
  table.mv tr.tot td{font-weight:800;background:#f3f3f3}
  @media(max-width:520px){
    table.mg tbody tr:not(.mgrest) td:first-child,table.mg .mgtitle{min-width:140px;max-width:140px;width:140px}
    table.mg tbody tr:not(.mgrest) td:first-child .cl{max-width:126px}
    table.mg td.mgres .cl{width:120px}
    table.mg td.mgnote .cl{width:80px}
  }

  table.mg tr.mgday td.mgsp{background:#f3f3f3}
  table.mg tr.mgcols td{background:#d9d9d9;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  table.mg tr.mgcols td.mgsp{background:#f3f3f3}
  table.mg td.mgex{background:#cccccc;font-weight:700}
  table.mg td.mgex:first-child{position:sticky;left:0;z-index:1;min-width:190px}
  table.mg td.mgex.c{font-weight:500}
  table.mg td.mgex a{color:#000;text-decoration:none}
  table.mg td.mgres{min-width:150px;white-space:normal}
  table.mg td.mgnote{min-width:120px;max-width:200px;white-space:normal;color:#333}
  table.mg tr.mgcn td{background:#fff8e1;font-size:11.5px;white-space:normal;max-width:360px}
  table.mg tr.mgcn td:first-child{font-weight:700;background:#f3f3f3}
  table.mg tr.mgcn td.mgsp{background:#f3f3f3}
  table.mg tr.mgvol td{background:#f3f3f3;color:#555;font-size:11px;text-align:center}
  table.mg tr.mgvol td:first-child{text-align:left}
  table.mg tr.mgvol.tot td{font-weight:800;color:#000}
  table.mg tr.mgrest td{background:#b6d7a8;font-weight:800}
  table.mg tr.mgrest.full td{background:#93c47d}
  table.mg tr.mggap td{background:#f3f3f3;padding:3px;border:0}

  .mseg{display:inline-flex;border:1px solid var(--line-bright);border-radius:9px;padding:3px;margin-bottom:12px;background:var(--panel)}
  .mseg button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:0;background:none;
    padding:8px 12px;border-radius:7px;color:var(--muted);cursor:pointer}
  .mseg button.on{background:var(--accent);color:#fff;cursor:default}
  .mwrest{padding:10px 16px;color:var(--muted)}
  table.mweek{width:100%;border-collapse:collapse;font-size:12.5px}
  table.mweek th{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);text-align:left;padding:4px 8px 6px;white-space:nowrap}
  table.mweek td{border-top:1px solid var(--line);padding:8px;vertical-align:top}
  table.mweek td:first-child{font-weight:600;min-width:200px;max-width:220px}
  table.mweek td,table.mweek th{white-space:nowrap}
  table.mweek .c{text-align:center}
  table.mweek .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.mweek td:first-child .cl{max-width:210px}
  table.mweek td.res .cl{max-width:190px;font-weight:600}
  table.mweek th.setg{border-left:1px solid var(--line);padding-bottom:0}
  table.mweek td.cw,table.mweek th.cw{background:var(--panel-2);border-left:1px solid var(--line);min-width:48px}
  table.mweek td.cr,table.mweek th.cr{min-width:40px}
  table.mweek td.cr{font-weight:700}
  table.mweek td.cw{font-weight:600;font-variant-numeric:tabular-nums}
  table.mweek td.lastc{white-space:nowrap;font-size:11.5px}
  .mwrest .hint{margin-left:6px}
  table.mweek td.csub .cl{max-width:180px}
  table.mweek td.nt .cl{max-width:160px}
  table.mweek td a{color:var(--fg);text-decoration:none}
  table.mweek td.sets{min-width:200px}
  table.mweek .sc{display:inline-block;border:1px solid var(--line-bright);border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;white-space:nowrap;background:#fff}
  table.mweek .sc i{font-style:normal;color:var(--muted-2);margin-right:5px;font-size:10.5px}
  table.mweek td.nt{min-width:150px;color:var(--fg)}
  table.meso{border-collapse:collapse;font-size:12.5px;margin-top:8px}
  table.meso th{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:4px;text-align:center;font-weight:700}
  table.meso th span{font-size:8px;letter-spacing:.04em}
  table.meso td{padding:2px;vertical-align:top}
  table.meso select{padding:6px;font-size:12.5px;min-width:130px}
  table.meso td:nth-child(2) select{min-width:140px}
  table.meso td:nth-child(3) select{min-width:240px}
  table.meso input.sm{width:72px;padding:6px;font-size:12.5px}
  table.meso input.xs{width:46px;padding:6px 4px;font-size:12.5px;text-align:center}
  table.meso .dl{background:var(--accent-soft)}

</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/control/"><span class="dot"></span>TRT-GUY<span class="slash">/</span>CLIENTS</a>
  <div class="right">
    <button class="btn sm" id="btnRefresh" hidden>Refresh</button>
    <a class="btn sm" href="/control/">Control Center</a>
    <span class="mono" id="buildTag" style="font-size:9px;letter-spacing:.12em;color:var(--muted-2)"></span>
    <button class="btn sm" id="btnLock" hidden>Lock</button>
  </div>
</header>

<main>
  <!-- passcode gate -->
  <section class="gate" id="gate">
    <h1>Client manager</h1>
    <p>Enter the passcode to load your roster.</p>
    <div class="fld"><input type="password" id="pw" placeholder="Passcode" autocomplete="current-password"></div>
    <button class="btn primary" id="btnUnlock" style="width:100%">Unlock</button>
    <p class="hint" id="gateErr" style="color:#0b0d10" hidden></p>
  </section>

  <section id="app" hidden>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input class="search" id="q" placeholder="Search name, email, phone…">
      <div class="chips" id="filters">

      </div>
      <span style="flex:1"></span>
      <button class="btn" id="btnStatuses">Statuses</button>
      <button class="btn" id="btnResources">Resources</button>
      <button class="btn" id="btnCopy">Page wording</button>
      <button class="btn" id="btnTemplate">Plan template</button>
      <button class="btn" id="btnImport">Import intake</button>
      <button class="btn primary" id="btnNew">+ New client</button>
    </div>

    <div id="list"></div>
  </section>
</main>

<script>
// Build stamp. On load the page re-fetches itself past the browser cache and
// compares this value; if the copy we were handed is old, it reloads once. A
// stale cache can otherwise hide a deploy for hours without any sign.
const BUILD = '2026-10-14T11:00Z';
(async () => {
  try {
    const r = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'reload' });
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && !sessionStorage.getItem('tg-reloaded')) {
      sessionStorage.setItem('tg-reloaded', '1');
      location.reload();
    }
  } catch (e) {}
})();

const WORKER = 'https://trt-guy-onboarding.julianhierro.workers.dev';
const SITE   = 'https://trt-guy.com';
const KEYLS  = 'tg-clients-key';

const TYPES = [
  ['full',      'Full client'],
  ['training',  'Training'],
  ['nutrition', 'Nutrition'],
  ['peds',      'PEDs'],
];
// The phases Julian runs. "custom" lets him name one himself.
const PHASES = [
  ['fatloss',     'Fat Loss Phase'],
  ['improvement', 'Improvement Phase'],
  ['maintenance', 'Maintenance Phase'],
  ['custom',      'Custom'],
];
// Pipeline stages. Julian edits these in "Statuses" (saved in tg_settings via the worker).
// `lead` (where applicants land) and `active` (a paying client) always exist.
const DEFAULT_STATUSES = [['active','Client'],['lead','Lead'],['follow-up','Follow up later'],['paused','Paused'],['ended','Ended']];
let STATUSES = DEFAULT_STATUSES.slice();
const LOCKED_STATUSES = ['lead', 'active'];
function setStatuses(list){
  STATUSES = (Array.isArray(list) && list.length) ? list.map(x => [x.key, x.label]) : DEFAULT_STATUSES.slice();
}
// Options for a status <select>; a value no longer on the list still shows, so nothing is silently changed.
function statusOptions(cur){
  const opts = STATUSES.slice();
  if(cur && !opts.some(s => s[0] === cur)) opts.push([cur, cur]);
  return opts.map(s => `<option value="${esc(s[0])}" ${cur === s[0] ? 'selected' : ''}>${esc(s[1])}</option>`).join('');
}
// Filter chips are drawn from the status list, plus All.
function buildChips(){
  const box = $('#filters');
  if(!STATUSES.some(s => s[0] === FILTER) && FILTER !== 'all') FILTER = 'active';
  box.innerHTML = [...STATUSES, ['all', 'All']].map(s =>
    `<button class="chip ${FILTER === s[0] ? 'on' : ''}" data-f="${esc(s[0])}">${esc(s[1])}</button>`).join('');
  $$('#filters .chip').forEach(b => b.onclick = () => {
    $$('#filters .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); FILTER = b.dataset.f; render();
  });
}
const PAYMETHODS = ['Stripe','PayPal','Bank transfer','Zelle','Crypto','Cash','Other'];

// The four blocks a client sees on their page. `key` is what lives in sections{}.
// Every button on the client page opens its link straight away. The written box
// is only used when a block has no link at all.
const SECTIONS = [
  { key:'training',       name:'Training',       blurb:'Opens the sheet for the program he is on (set it under Programs below)' },
  { key:'daily_checkin',  name:'Daily Check In', blurb:'Opens the daily sheet or form' },
  { key:'peds',           name:'PED Protocol',   blurb:'Opens the protocol sheet' },
  { key:'weekly_checkin', name:'Weekly Check In',blurb:'Opens the weekly check-in sheet or form' },
];
// Which blocks switch on by default for each client type.
const TYPE_SECTIONS = {
  full:      ['training','daily_checkin','peds','weekly_checkin'],
  training:  ['training','daily_checkin','weekly_checkin'],
  nutrition: ['daily_checkin','weekly_checkin'],
  peds:      ['peds','daily_checkin','weekly_checkin'],
};

let KEY = localStorage.getItem(KEYLS) || '';
let CLIENTS = [];
let FILTER = 'active';
let QUERY = '';
let OPEN = null;   // the client currently in the panel
let SEL = new Set();   // ids ticked for bulk delete
let TAB = 'details';

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n == null || n === '') ? '—' : '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
const DAY = 86400000;

// Puts a clickable "open ↗" next to every link field so a media link can be
// opened/checked straight from the editor. Safe to call repeatedly.
function wireOpenLinks(scope){
  (scope || document).querySelectorAll('input[id$="_link"], input[data-p="link"], input[data-e="link"]').forEach(inp => {
    if(inp.dataset.openWired) return; inp.dataset.openWired = '1';
    const a = document.createElement('a');
    a.className = 'btn sm openlink'; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Open this link'; a.textContent = '↗';
    const sync = () => { const v = (inp.value || '').trim(); a.href = v || '#'; a.style.display = v ? '' : 'none'; };
    sync(); inp.addEventListener('input', sync);
    inp.insertAdjacentElement('afterend', a);
  });
}

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + (String(d).length === 10 ? 'T12:00:00' : ''));
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function daysLeft(c){
  if(!c.end_date) return null;
  const end = new Date(c.end_date + 'T23:59:59');
  return Math.ceil((end - Date.now()) / DAY);
}
// start + N months, kept as a plain YYYY-MM-DD string.
function addMonths(dateStr, months){
  if(!dateStr || !months) return '';
  const d = new Date(dateStr + 'T12:00:00');
  if(isNaN(d)) return '';
  const day = d.getDate();
  d.setMonth(d.getMonth() + Number(months));
  if(d.getDate() < day) d.setDate(0);           // clamp Jan 31 + 1mo → Feb 28/29
  return d.toISOString().slice(0,10);
}

// start + N weeks, as a plain YYYY-MM-DD string.
function addWeeks(dateStr, weeks){
  if(!dateStr || !weeks) return '';
  const d = new Date(dateStr + 'T12:00:00');
  if(isNaN(d)) return '';
  d.setDate(d.getDate() + Number(weeks) * 7);
  return d.toISOString().slice(0,10);
}

async function api(path, opts = {}){
  const res = await fetch(WORKER + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'X-CC-Key': KEY, ...(opts.headers || {}) },
  });
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

/* ── gate ─────────────────────────────────────────────────────────────────── */
async function unlock(k){
  KEY = k;
  const j = await api('/clients');
  localStorage.setItem(KEYLS, k);
  CLIENTS = j.clients || [];
  setStatuses(j.statuses); buildChips();
  $('#gate').hidden = true;
  $('#app').hidden = false;
  $('#btnLock').hidden = false;
  $('#btnRefresh').hidden = false;
  render();
}
$('#btnUnlock').onclick = async () => {
  const v = $('#pw').value.trim();
  if(!v) return;
  try { await unlock(v); } catch(e){ $('#gateErr').hidden = false; $('#gateErr').textContent = 'Wrong passcode.'; }
};
$('#pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('#btnUnlock').click(); });
$('#btnLock').onclick = () => { localStorage.removeItem(KEYLS); location.reload(); };
$('#btnRefresh').onclick = async () => { const j = await api('/clients'); CLIENTS = j.clients || []; setStatuses(j.statuses); buildChips(); render(); toast('Refreshed'); };

/* ── list ─────────────────────────────────────────────────────────────────── */
function visible(){
  return CLIENTS.filter(c => {
    if(FILTER !== 'all' && (c.status || 'lead') !== FILTER) return false;
    if(!QUERY) return true;
    const hay = [c.name, c.email, c.phone, c.instagram, c.slug].join(' ').toLowerCase();
    return hay.includes(QUERY);
  });
}
// Nothing switched on means his page shows only the phase card — worth saying so.
function pageEmpty(c){
  const sec = c.sections || {};
  const mac = sec.macros || {};
  const hasMac = mac.on && [mac.calories, mac.protein, mac.carbs, mac.fat].some(v => v != null && v !== '');
  const hasProg = (sec.programs || []).some(p => (p.link || '').trim());
  const hasBlock = SECTIONS.some(s => {
    const b = sec[s.key] || (s.key === 'weekly_checkin' ? sec.checkin : null) || {};
    return b.on && ((b.link || '').trim() || (b.text || '').trim());
  });
  return !hasMac && !hasProg && !hasBlock;
}
function renderStats(){
  const act = CLIENTS.filter(c => c.status === 'active');
  const leads = CLIENTS.filter(c => (c.status || 'lead') === 'lead');
  const collected = act.reduce((s,c) => s + (Number(c.amount_paid) || 0), 0);
  const ending = act.filter(c => { const d = daysLeft(c); return d !== null && d <= 21; });
  $('#stats').innerHTML = `
    <div class="stat"><div class="k">Active clients</div><div class="v">${act.length}</div></div>
    <div class="stat"><div class="k">Collected · active</div><div class="v">${money(collected)}</div></div>
    <div class="stat"><div class="k">Renewing in 21 days</div><div class="v">${ending.length}</div></div>
    <div class="stat"><div class="k">New intakes</div><div class="v">${leads.length}</div></div>`;
  renderChipCounts();
}
// Each chip carries its own count — the reason a fresh import "disappears" is that
// it lands as a lead while the list is filtered to Active.
function renderChipCounts(){
  const n = f => f === 'all' ? CLIENTS.length : CLIENTS.filter(c => (c.status || 'lead') === f).length;
  $$('#filters .chip').forEach(b => {
    const base = b.dataset.label || (b.dataset.label = b.textContent.trim());
    const count = n(b.dataset.f);
    b.textContent = count ? `${base} ${count}` : base;
  });
}
function render(){
  renderStats();
  const rows = visible();
  if(!rows.length){
    $('#list').innerHTML = `<div class="empty">No clients here yet.<br><br>
      <span style="font-size:13px">Use <b>+ New client</b>, or <b>Import intake</b> to pull someone who has finished the onboarding form.</span></div>`;
    return;
  }
  // Only keep selections that are still on screen.
  SEL = new Set([...SEL].filter(id => rows.some(c => c.id === id)));
  const allSel = rows.length && rows.every(c => SEL.has(c.id));
  $('#list').innerHTML = `
    <div class="bulk" ${SEL.size ? '' : 'hidden'}>
      <span><b id="bulkN">${SEL.size}</b> selected</span>
      <button class="btn sm" id="bulkNone">Clear</button>
      <span style="flex:1"></span>
      <button class="btn sm danger" id="bulkDel">Delete selected</button>
    </div>
    <table><thead><tr>
      <th class="cbcol"><input type="checkbox" class="cb" id="selAll" ${allSel ? 'checked' : ''}></th>
      <th>Client</th><th>Contact</th><th>Type</th><th>Term</th><th>Paid</th><th>Status</th><th></th>
    </tr></thead><tbody>` + rows.map(c => {
      const d = daysLeft(c);
      const leftTxt = d === null ? '' : (d < 0 ? `${Math.abs(d)}d over` : `${d}d left`);
      const leftCls = d === null ? '' : (d < 0 ? 'over' : (d <= 21 ? 'warn' : ''));
      const typeName = (TYPES.find(t => t[0] === c.client_type) || [null,'—'])[1];
      return `<tr data-id="${c.id}">
        <td class="cbcol" data-l=""><input type="checkbox" class="cb rowsel" data-id="${c.id}" ${SEL.has(c.id) ? 'checked' : ''}></td>
        <td class="main"><div class="cname">${esc(c.name || '—')}</div>
          <div class="curl">trt-guy.com/${esc(c.slug)}</div></td>
        <td data-l="Contact"><div>${esc(c.email || '—')}</div><div class="csub">${esc(c.phone || '')}</div></td>
        <td data-l="Type"><span class="type">${esc(typeName)}</span></td>
        <td data-l="Term"><div>${fmtDate(c.start_date)} → ${fmtDate(c.end_date)}</div>
          <div class="left ${leftCls}">${leftTxt}</div></td>
        <td data-l="Paid"><div>${money(c.amount_paid)}</div><div class="csub">${esc(c.pay_method || '')}</div></td>
        <td data-l="Status"><select class="rowstatus st-${esc(c.status || 'lead')}" data-id="${c.id}" title="Change status">${statusOptions(c.status || 'lead')}</select>
          ${pageEmpty(c) ? '<div class="csub" style="color:var(--muted);margin-top:4px">page empty</div>' : ''}</td>
        <td data-l="" class="acts"><button class="btn sm">Open</button>
          <button class="btn sm danger rowdel" data-id="${c.id}" title="Delete">Delete</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';

  $$('#list tbody tr').forEach(tr => tr.onclick = () => openClient(tr.dataset.id));
  // Checkbox and trash live inside the row, so they must not open the client.
  $$('#list .rowsel').forEach(cb => cb.onclick = e => {
    e.stopPropagation();
    cb.checked ? SEL.add(cb.dataset.id) : SEL.delete(cb.dataset.id);
    render();
  });
  $$('#list .rowdel').forEach(b => b.onclick = e => { e.stopPropagation(); delOne(b.dataset.id); });
  // Status right from the list: lead → client without opening the file.
  $$('#list .rowstatus').forEach(sel => {
    sel.onclick = e => e.stopPropagation();
    sel.onchange = async e => {
      e.stopPropagation();
      const c = CLIENTS.find(x => x.id === sel.dataset.id);
      if(!c) return;
      const prev = c.status || 'lead';
      sel.disabled = true;
      try {
        await api('/clients', { method:'POST', body: JSON.stringify({ id: c.id, status: sel.value }) });
        c.status = sel.value;
        const label = (STATUSES.find(t => t[0] === sel.value) || [0, sel.value])[1];
        toast(`${c.name || c.slug} → ${label}`);
        render();
      } catch(err){
        sel.value = prev; sel.disabled = false;
        toast('Could not save — try again');
      }
    };
  });
  const all = $('#selAll');
  if(all) all.onclick = e => {
    e.stopPropagation();
    SEL = all.checked ? new Set(rows.map(c => c.id)) : new Set();
    render();
  };
  if($('#bulkNone')) $('#bulkNone').onclick = () => { SEL = new Set(); render(); };
  if($('#bulkDel')) $('#bulkDel').onclick = delSelected;
}

async function delOne(id){
  const c = CLIENTS.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`Delete ${c.name || c.slug}? Their page stops working and the record is gone.`)) return;
  try {
    await api('/clients', { method:'POST', body: JSON.stringify({ action:'delete', id }) });
    CLIENTS = CLIENTS.filter(x => x.id !== id);
    SEL.delete(id);
    render(); toast('Deleted');
  } catch(e){ alert('Could not delete: ' + e.message); }
}
async function delSelected(){
  const ids = [...SEL];
  if(!ids.length) return;
  if(!confirm(`Delete ${ids.length} client${ids.length > 1 ? 's' : ''}? Their pages stop working and the records are gone.`)) return;
  const btn = $('#bulkDel'); btn.disabled = true;
  let done = 0, failed = 0;
  for(const id of ids){
    btn.textContent = `Deleting ${++done}/${ids.length}…`;
    try {
      await api('/clients', { method:'POST', body: JSON.stringify({ action:'delete', id }) });
      CLIENTS = CLIENTS.filter(x => x.id !== id);
    } catch(e){ failed++; }
  }
  SEL = new Set();
  render();
  toast(failed ? `Deleted ${ids.length - failed}, ${failed} failed` : `Deleted ${ids.length}`);
}

function drawStatusPanel(list){
  closePanel();
  const used = k => CLIENTS.filter(c => (c.status || 'lead') === k).length;
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.id = 'scrim';

  p.innerHTML = `

            <button class="btn sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
            <button class="btn sm" data-dn="${i}" ${i === list.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
            ${LOCKED_STATUSES.includes(s.key)
              ? '<span class="hint" style="min-width:64px;margin:0;text-align:center">built in</span>'
              : `<button class="btn sm danger" data-rm="${i}" style="min-width:64px">Remove</button>`}

        <div style="display:flex;gap:8px;margin-top:14px">
          <input id="stNew" placeholder="New status, e.g. Call booked" style="flex:1">
          <button class="btn sm" id="stAdd">+ Add</button>
        </div>
      </div>
    </div>
    <div class="pfoot">
      <span></span>
      <button class="btn primary" id="pSave">Save</button>
    </div>`;
  document.body.append(scrim, p);
  scrim.onclick = closePanel;
  p.querySelector('#pClose').onclick = closePanel;
  // Keep typed labels when the list redraws.
  const sync = () => $$('#pBody [data-st]').forEach(i => { list[+i.dataset.st].label = i.value; });
  $$('#pBody [data-up]').forEach(b => b.onclick = () => { sync(); const i = +b.dataset.up; [list[i-1], list[i]] = [list[i], list[i-1]]; drawStatusPanel(list); });
  $$('#pBody [data-dn]').forEach(b => b.onclick = () => { sync(); const i = +b.dataset.dn; [list[i+1], list[i]] = [list[i], list[i+1]]; drawStatusPanel(list); });
  $$('#pBody [data-rm]').forEach(b => b.onclick = () => {
    sync();
    const s = list[+b.dataset.rm], n = used(s.key);
    if(n) return alert(`${n} ${n === 1 ? 'person has' : 'people have'} the status "${s.label}". Move them to another status first.`);
    list.splice(+b.dataset.rm, 1); drawStatusPanel(list);
  });
  const add = () => {
    sync();
    const label = $('#stNew').value.trim();
    if(!label) return;
    let base = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'status';
    let key = base, n = 2;
    while(list.some(s => s.key === key) || key === 'all') key = `${base}-${n++}`;
    list.push({ key, label }); drawStatusPanel(list);
    $('#stNew').focus();
  };
  p.querySelector('#stAdd').onclick = add;
  p.querySelector('#stNew').addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
  p.querySelector('#pSave').onclick = async () => {
    sync();
    if(list.some(s => !s.label.trim())) return alert('Every status needs a name.');
    const btn = $('#pSave'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const j = await api('/clients', { method:'POST', body: JSON.stringify({ action:'statuses_save', statuses: list.map(s => ({ key: s.key, label: s.label.trim() })) }) });

      toast('Statuses saved'); closePanel();
    } catch(e){ alert('Could not save: ' + e.message); btn.disabled = false; btn.textContent = 'Save'; }
  };
}

      ${tpl ? '<span class="hint">Applies to new clients only.</span>' : '<button class="btn danger sm" id="pDelete">Delete</button>'}
      <div style="display:flex;gap:10px;align-items:center">
        <span class="hint" id="pSaved"></span>
        <button class="btn primary" id="pSave">Save</button>
      </div>
    </div>`;
  document.body.append(scrim, p);
  scrim.onclick = closePanel;
  p.querySelector('#pClose').onclick = closePanel;
  p.querySelectorAll('.ptab').forEach(b => b.onclick = () => { collect(); TAB = b.dataset.t; drawPanel(); });
  // Opens his page with the code already in the link — the exact screen he sees.
  if(p.querySelector('#pPreview')) p.querySelector('#pPreview').onclick = () => {
    collect();
    window.open(`${SITE}/${c.slug}${c.pin ? '?pin=' + encodeURIComponent(c.pin) : ''}`, '_blank', 'noopener');
  };
  p.querySelector('#pSave').onclick = tpl ? saveTemplate : save;
  if(!tpl) p.querySelector('#pDelete').onclick = del;
  drawBody();
}

/* ── Tracker tabs: the client Google Sheet, rebuilt ─────────────────────────
   Tracking  — his daily logs + weekly check-ins, week by week (Daily / Weekly Check In tabs)
   Timeline  — the Timeline tab: one column per week, typed here, carried forward
   Training  — the Training tab: split, exercises + sets per week, volume plan
   Protocols — Fertility Protocol / Show Day / written protocols
   Logs live in tg_logs; the plan pieces live in his `sections`. Weeks run Mon → Sun. */
const T_PAD = n => String(n).padStart(2, '0');
const tIso = d => `${d.getFullYear()}-${T_PAD(d.getMonth() + 1)}-${T_PAD(d.getDate())}`;
const tD = s => new Date(s + 'T12:00:00');
const tAdd = (s, n) => { const d = tD(s); d.setDate(d.getDate() + n); return tIso(d); };
const tMon = s => tAdd(s, -((tD(s).getDay() + 6) % 7));
const tWeeks = (a, b) => Math.round((tD(b) - tD(a)) / 6048e5);
const tNum = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const tAvg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
const tNf = (v, dp = 0) => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: dp, minimumFractionDigits: dp });
const tRid = () => Math.random().toString(36).slice(2, 8);
const tIsoWeek = s => { const d = tD(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };
const T_WEEKLY = [
  ['score','Score (1-5)'], ['why','Why that number'], ['training_ok','Training plan up to date'], ['daily_ok','Daily check-in up to date'],
  ['adherence','Diet adherence'], ['appetite','Appetite / hunger'], ['sleep','Sleep'], ['rested','Rested after sleep'],
  ['energy','Energy'], ['stress','Stress (1-5)'], ['mood','Mood'], ['motivation','Motivation'], ['win','Win of the week'],
  ['action','Number one action'], ['diet_issues','Diet issues'], ['training_issues','Training issues'],
  ['other_issues','Other issues'], ['help','Anything I can help with'], ['feedback','Feedback on coaching'], ['questions','Questions'],
];
const T_MEAS = [['m_waist','Waist'],['m_rbicep','R Bicep'],['m_lbicep','L Bicep'],['m_rquad','R Quad'],['m_lquad','L Quad'],
  ['m_chest','Chest'],['m_shoulders','Shoulders'],['m_neck','Neck'],['m_hips','Hips'],['m_rforearm','R Forearm'],['m_lforearm','L Forearm'],

async function ensureLogs(c){
  if(c._logs) return c._logs;
  const j = await api('/clients?action=logs&id=' + encodeURIComponent(c.id) + '&from=' + tAdd(tMon(tIso(new Date())), -7 * 52));
  c._logs = j.logs || [];
  return c._logs;
}
async function putLog(c, kind, day, data){
  const empty = !Object.keys(data).length;
  const j = await api('/clients', { method:'POST', body: JSON.stringify(empty
    ? { action:'log_remove', id:c.id, kind, day } : { action:'log_save', id:c.id, kind, day, data }) });
  c._logs = (c._logs || []).filter(l => !(l.kind === kind && l.day === day));
  if(!empty) c._logs.push(j.log);
}
const tLog = (c, kind, day) => ((c._logs || []).find(l => l.kind === kind && l.day === day) || {}).data || null;
const tStart = c => c.start_date || (c.phase || {}).start || '';
const tCoachWeek = (c, m) => { const s = tStart(c); if(!s) return null; const w = tWeeks(tMon(s), m) + 1; return w >= 1 ? w : null; };
const tKcalOf = d => d.kcal != null ? tNum(d.kcal)
  : (d.protein != null && d.carbs != null && d.fat != null) ? (tNum(d.protein) + tNum(d.carbs)) * 4 + tNum(d.fat) * 9 : null;
function tWeekStats(c, m){
  const days = [...Array(7)].map((_, j) => ({ day: tAdd(m, j), d: tLog(c, 'daily', tAdd(m, j)) }));
  const got = days.filter(x => x.d && (['weight','protein','carbs','fat','steps','sys','pulse','cardio'].some(k => x.d[k] != null) || x.d.notes)).map(x => x.d);
  const a = k => tAvg(got.map(d => tNum(d[k])));
  return { days, n: got.length, weight: a('weight'), kcal: tAvg(got.map(tKcalOf)), protein: a('protein'), carbs: a('carbs'),
    fat: a('fat'), fiber: a('fiber'), steps: a('steps'), sys: a('sys'), dia: a('dia'), pulse: a('pulse'),
    cardio: got.reduce((s, d) => s + (tNum(d.cardio) || 0), 0)
      + (c._logs || []).filter(l => l.kind === 'training' && l.day >= m && l.day <= tAdd(m, 6)).reduce((s, l) => s + (tNum(l.data.c_min) || 0), 0) };
}
const tlRowsOf = c => {
  const r = (c.sections || {}).timeline_rows;
  return Array.isArray(r) && r.length ? r.map(x => x.k && x.k[0] === '_' ? (TL_AUTO.find(a => a.k === x.k) || x) : x) : TL_DEFAULT.slice();
};
function tlCell(c, m, k){
  const own = tLog(c, 'target', m);
  if(own && own[k] != null && own[k] !== '') return { v: own[k], carried: false };
  if(TL_NO_CARRY.has(k)) return { v: null };
  const prev = (c._logs || []).filter(l => l.kind === 'target' && l.day < m && l.data[k] != null && l.data[k] !== '')
    .sort((a, b) => a.day < b.day ? 1 : -1)[0];
  if(!prev) return { v: null };
  if(k === 'cycle' && tNum(prev.data.cycle) != null) return { v: tNum(prev.data.cycle) + tWeeks(prev.day, m), carried: true };
  if(/^(off|stop|stopped)$/i.test(String(prev.data[k]).trim())) return { v: null, carried: true };   // stopped
  return { v: prev.data[k], carried: true };
}
const tlNum = (c, m, k) => tNum(tlCell(c, m, k).v);
function tTargetFor(c, m){
  const d = {};
  ['goal'].forEach(k => { const v = tlCell(c, m, k).v; if(v != null) d[k] = v; });
  ['protein','carbs','fat','fiber','steps','cardio'].forEach(k => { const v = tlNum(c, m, k); if(v != null) d[k] = v; });
  if(d.protein != null && d.carbs != null && d.fat != null) d.kcal = (d.protein + d.carbs) * 4 + d.fat * 9;
  return d;
}
function tlAuto(c, m, k){
  const st = () => tWeekStats(c, m);
  switch(k){
    case '_date': return fmtDate(m);
    case '_woy': return tIsoWeek(m);
    case '_woc': return tCoachWeek(c, m) || '';
    case '_bw': { const s = st(); return s.weight == null ? '' : tNf(s.weight, 1); }
    case '_bp': { const s = st(); return s.sys == null ? '' : tNf(s.sys) + '/' + tNf(s.dia); }
    case '_hr': { const s = st(); return s.pulse == null ? '' : tNf(s.pulse); }
    case '_sf': { const v = tSkin(tLog(c, 'weekly', m)); return v == null ? '' : tNf(v, 1); }
    case '_kcal': { const p = tlNum(c, m, 'protein'), cb = tlNum(c, m, 'carbs'), f = tlNum(c, m, 'fat');
      return (p != null && cb != null && f != null) ? tNf((p + cb) * 4 + f * 9) : ''; }
    case '_avgkcal': { const s = st(); return s.kcal == null ? '' : tNf(s.kcal); }
    case '_avgsteps': { const s = st(); return s.steps == null ? '' : tNf(s.steps); }
    case '_cardiodone': { const s = st(); return s.n ? tNf(s.cardio) : ''; }
    case '_q': { const w = tLog(c, 'weekly', m) || {}; return [w.questions, w.help].filter(Boolean).join(' · '); }
    case '_dnotes': case '_tnotes': case '_cnotes': return tWeekNotes(c, m, k);
    case '_mg': { const v = tlRowsOf(c).filter(r => r.g === 'aas' && r.k[0] !== '_').map(r => parseFloat(tlCell(c, m, r.k).v)).filter(x => !isNaN(x));
      return v.length ? tNf(v.reduce((a, b) => a + b, 0)) : ''; }
  }
  return '';
}

      : ` <button class="tlx" data-ren="${esc(r.k)}" title="Rename">✎</button><button class="tlx" data-del="${esc(r.k)}" title="Remove row">✕</button>`;
    return `<tr><th><span class="tlname">${esc(r.l)}</span>${tools}</th>${weeks.map(m => {
      if(r.k === '@lab' || r.k === '@photo'){
        const t = r.k.slice(1), files = tFiles(c, m).filter(f => f.t === t);
        const wk = tLog(c, 'weekly', m) || {};
        const theirs = t === 'photo' ? T_PICS.filter(([k]) => wk[k]).map(([k, l]) => `<a class="fchip" href="${esc(wk[k])}" target="_blank" rel="noopener" title="His ${l} photo">${l[0]}</a>`).join('') : '';
        return `<td ${td(m)}><div class="fcell">${theirs}${files.map(f => `<span class="fchip"><a href="${esc(f.u)}" target="_blank" rel="noopener" title="${esc(f.n)}">${t === 'photo' ? '🖼' : '📄'}</a><button class="tlx" data-fdel="${m}|${esc(f.u)}" title="Remove">×</button></span>`).join('')}
          <label class="fup" title="Upload ${t === 'photo' ? 'photos' : 'labs'}">+<input type="file" hidden multiple accept="${t === 'photo' ? 'image/*' : 'image/*,application/pdf'}" data-up="${t}" data-m="${m}"></label></div></td>`;
      }
      if(['_dnotes','_tnotes','_cnotes'].includes(r.k)){ const v = tlAuto(c, m, r.k);
        return `<td class="auto nt ${m === now ? 'now' : ''}">${v ? `<div class="nclamp" title="Click to expand">${esc(v)}</div>` : ''}</td>`; }
      if(auto) return `<td class="auto ${m === now ? 'now' : ''}">${esc(tlAuto(c, m, r.k))}</td>`;
      const cell = tlCell(c, m, r.k);
      const pic = r.k === 'pics' && T_PICS.some(([k]) => (tLog(c, 'weekly', m) || {})[k]);
      return `<td ${td(m)}><input data-m="${m}" data-k="${esc(r.k)}" value="${cell.carried || cell.v == null ? '' : esc(cell.v)}"
        placeholder="${pic ? '✓ pics' : cell.carried && cell.v != null ? esc(cell.v) : ''}" ${r.k === 'goal' ? 'list="tlGoals"' : ''}></td>`;
    }).join('')}</tr>`;
  };
  const groupHead = (label, g) => `<tr class="tlg"><th>${esc(label)}${g ? ` <button class="tladd" data-addrow="${g}" title="Add a row">+ row</button>` : ''}</th>${weeks.map(m => `<td ${td(m)}></td>`).join('')}</tr>`;
  const head = `<tr class="tlh"><th>Week</th>${weeks.map(m => `<td ${td(m)}>${tCoachWeek(c, m) ? 'W' + tCoachWeek(c, m) : ''}<br><span class="csub">${fmtDate(m)}</span></td>`).join('')}</tr>`;

  let body = '';
  if(mode === 'pharma'){
    body += rows.filter(r => r.g === 'week' && ['_date','_woy','_woc','cycle','event'].includes(r.k)).map(r => rowHtml(r)).join('');
    body += groupHead('Composition / Diagnostics') + PH_TOP.map(r => rowHtml(r, { fixed:true })).join('');
    PH_GROUPS.forEach(g => { body += groupHead(PH_GROUP_LABEL[g], g) + rows.filter(r => r.g === g).map(r => rowHtml(r)).join(''); });
    body += groupHead('All notes') + rowHtml({ k:'note', l:'Notes (yours)' }, { fixed:true }) + T_NOTE_ROWS.map(r => rowHtml(r)).join('');
  } else {
    TL_GROUPS.filter(([g]) => TL_VIEW_GROUPS.includes(g)).forEach(([g, gl]) => {
      body += groupHead(gl, g) + rows.filter(r => r.g === g && r.k !== 'note').map(r => rowHtml(r)).join('');
    });
    body += groupHead('All notes') + rowHtml({ k:'note', l:'Notes (yours)' }, { fixed:true }) + T_NOTE_ROWS.map(r => rowHtml(r)).join('');
  }

  const known = PH_KNOWN.map(([n]) => n).concat(rows.filter(r => PH_GROUPS.includes(r.g)).map(r => r.l));
  b.innerHTML = `
    ${mode === 'pharma' ? `<div class="sect rx">
      <div class="shead"><h3>Prescribe</h3><span class="hint">Fills his Pharmacology timeline from that week on</span></div>
      <div class="rxrow">
        <div><label class="fl">Compound</label><input id="rx_name" list="rxKnown" placeholder="Testosterone E."></div>
        <div><label class="fl">Category</label><select id="rx_group">${PH_GROUPS.map(g => `<option value="${g}">${PH_GROUP_LABEL[g]}</option>`).join('')}</select></div>
        <div><label class="fl">Dose</label><input id="rx_dose" placeholder="350"></div>
        <div><label class="fl">From week of</label><input type="date" id="rx_from" value="${now}"></div>
        <div><label class="fl">Until (optional)</label><input type="date" id="rx_to"></div>
        <div style="align-self:end"><button class="btn primary" id="rxGo">Prescribe</button></div>
      </div>
      <p class="hint" id="rxHint">AAS: mg per week (e.g. 350) — they add up in Total Weekly mg's. Everything else as you'd write it: 500/D, 5mg/D, 10iu am, 100mcg 3X.</p>
      <datalist id="rxKnown">${[...new Set(known)].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    </div>` : ''}
    <p class="hint" style="margin:0 0 10px">${mode === 'pharma'
      ? 'Type straight into a week, or use Prescribe. A dose carries into the following weeks (grey) until you change it — type <b>off</b> to stop it. Top rows fill themselves from his logs. <b>+</b> uploads labs or photos to that week; he sees them on his page.'
      : 'Type straight into a week. A value carries into the following weeks (shown grey) until you type a new one. Notes, Labs, Pics and Event don\'t carry. Rows marked auto fill themselves from his logs. Compounds now live in the Pharmacology tab.'}</p>
    <datalist id="tlGoals">${T_GOALS.map(g => `<option value="${g}">`).join('')}</datalist>
    <div class="tlwrap" id="tlWrap"><table class="tl"><tbody>${head}${body}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" id="tlReset">Reset rows to the sheet's list</button></div>`;
  const nowCell = $('#tlWrap td.now'); if(nowCell) $('#tlWrap').scrollLeft = Math.max(0, nowCell.offsetLeft - 260);
  $$('#tlWrap .nclamp').forEach(n => n.onclick = () => n.classList.toggle('open'));

  const redraw = async () => { const sl = $('#tlWrap').scrollLeft, st = $('#pBody').scrollTop; await drawTimeline(c, b, mode); if($('#tlWrap')) $('#tlWrap').scrollLeft = sl; $('#pBody').scrollTop = st; };
  const setCell = async (m, k, v, numeric) => {
    const data = Object.assign({}, tLog(c, 'target', m) || {});
    if(v === '' || v == null) delete data[k]; else data[k] = (numeric && tNum(v) != null) ? Number(v) : v;
    await putLog(c, 'target', m, data);
  };
  const isNumKey = k => !['goal','note','labs','event','pics'].includes(k);
  $$('#tlWrap input[data-m][data-k]').forEach(inp => inp.onchange = async () => {
    inp.disabled = true;
    try { await setCell(inp.dataset.m, inp.dataset.k, inp.value.trim(), isNumKey(inp.dataset.k)); await redraw(); }
    catch(e){ alert('Could not save: ' + e.message); inp.disabled = false; }
  });
  // uploads: labs (PDF / images) and photos, filed under that week
  $$('#tlWrap input[data-up]').forEach(inp => inp.onchange = async () => {
    const files = [...(inp.files || [])]; if(!files.length) return;
    const m = inp.dataset.m, t = inp.dataset.up, lab = inp.closest('label'); lab.classList.add('busy');
    try {
      const list = tFiles(c, m);
      for(const f of files){
        const fd = new FormData(); fd.append('file', f); fd.append('kind', t); fd.append('slug', c.slug || '');
        const res = await fetch(WORKER + '/clients', { method:'POST', headers:{ 'X-CC-Key': KEY }, body: fd });
        const j = await res.json().catch(() => ({}));
        if(!res.ok || !j.url) throw new Error(j.error || 'Upload failed (' + res.status + ')');
        list.push({ u: j.url, n: f.name || t, t });
      }
      await putLog(c, 'files', m, tFilesData(list));
      toast(files.length > 1 ? files.length + ' files uploaded' : 'Uploaded');
      await redraw();
    } catch(e){ alert(e.message); lab.classList.remove('busy'); }
  });
  $$('#tlWrap [data-fdel]').forEach(btn => btn.onclick = async () => {
    const [m, u] = btn.dataset.fdel.split('|');
    if(!confirm('Remove this file from the week?')) return;
    try { await putLog(c, 'files', m, tFilesData(tFiles(c, m).filter(f => f.u !== u))); await redraw(); } catch(e){ alert(e.message); }
  });
  const setRows = async rs => { c.sections = Object.assign({}, c.sections || {}, { timeline_rows: rs }); await saveSections(c); await redraw(); };
  const addRow = (rs, l, g) => { const idx = rs.map(r => r.g).lastIndexOf(g); const r = { k: 'x_' + tRid(), l, g }; rs.splice(idx < 0 ? rs.length : idx + 1, 0, r); return r; };
  $$('#tlWrap [data-addrow]').forEach(btn => btn.onclick = async () => {
    const l = prompt('Name of the new row (e.g. Anavar, BPC 157, Vitamin D3):'); if(!l || !l.trim()) return;
    const rs = tlRowsOf(c); addRow(rs, l.trim(), btn.dataset.addrow);
    try { await setRows(rs); } catch(e){ alert(e.message); }
  });
  $$('#tlWrap [data-ren]').forEach(btn => btn.onclick = async () => {
    const rs = tlRowsOf(c), r = rs.find(x => x.k === btn.dataset.ren); const l = prompt('Rename row:', r.l); if(!l || !l.trim()) return;
    r.l = l.trim(); try { await setRows(rs); } catch(e){ alert(e.message); }
  });
  $$('#tlWrap [data-del]').forEach(btn => btn.onclick = async () => {
    const rs = tlRowsOf(c), r = rs.find(x => x.k === btn.dataset.del);
    if(!confirm(`Remove the “${r.l}” row? Values already typed stay stored, they just stop showing.`)) return;
    try { await setRows(rs.filter(x => x.k !== r.k)); } catch(e){ alert(e.message); }
  });
  $('#tlReset').onclick = async () => {
    if(!confirm("Put the rows back to the sheet's list? Rows you added disappear from view (their values stay stored).")) return;
    try { await setRows(TL_DEFAULT.slice()); } catch(e){ alert(e.message); }
  };

  if(mode !== 'pharma') return;
  // Prescribe: find or create the row, write the dose into the start week, "off" after the end.
  $('#rx_name').oninput = () => {
    const n = $('#rx_name').value.trim().toLowerCase();
    const hit = rows.find(r => r.l.toLowerCase() === n && PH_GROUPS.includes(r.g)) || PH_KNOWN.find(([k]) => k.toLowerCase() === n);
    if(hit) $('#rx_group').value = hit.g || hit[1];
  };
  $('#rxGo').onclick = async () => {
    const name = $('#rx_name').value.trim(), dose = $('#rx_dose').value.trim(), g = $('#rx_group').value;
    if(!name || !dose) return alert('Compound and dose, please.');
    const start = tMon($('#rx_from').value || now), until = $('#rx_to').value ? tMon($('#rx_to').value) : '';
    if(until && until < start) return alert('"Until" is before "From".');
    const btn = $('#rxGo'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const rs = tlRowsOf(c);
      let r = rs.find(x => x.l.toLowerCase() === name.toLowerCase() && PH_GROUPS.includes(x.g));
      if(!r){ r = addRow(rs, name, g); c.sections = Object.assign({}, c.sections || {}, { timeline_rows: rs }); await saveSections(c); }
      await setCell(start, r.k, dose, g === 'aas');
      if(until){
        const after = tAdd(until, 7), own = tLog(c, 'target', after) || {};
        if(own[r.k] == null || own[r.k] === '') await setCell(after, r.k, 'off', false);
      }
      toast(`${name} ${dose} from ${fmtDate(start)}${until ? ' to ' + fmtDate(tAdd(until, 6)) : ''}`);
      await redraw();
    } catch(e){ alert('Could not save: ' + e.message); btn.disabled = false; btn.textContent = 'Prescribe'; }
  };
}

/* The whole mesocycle as one sheet, coloured like the training spreadsheet:
   black day headers, grey exercise columns, each week in its own colour
   (light yellow → yellow → orange → dark red → red, deload green), green rest rows. */
const MESO_WEEK_COLORS = ['#FFF2CC', '#FFD966', '#F6B26B', '#CC0000', '#FF0000'];
const MESO_DELOAD = '#34A853';
function mesoWeekColor(tp, i){
  const w = (tp.weeks || [])[i] || {};
  const bg = w.deload ? MESO_DELOAD : MESO_WEEK_COLORS[Math.min(i, MESO_WEEK_COLORS.length - 1)];
  const dark = ['#CC0000', '#FF0000', MESO_DELOAD].includes(bg);
  return { bg, fg: dark ? '#fff' : '#000' };
}
// Where an exercise sits in a logged session — matched by name, so moving exercises keeps their results.
function mExAt(l, name, i){
  if(!l) return -1;
  if(l['e' + i + 'n'] === name) return i;
  for(let j = 0; j < 40; j++) if(l['e' + j + 'n'] === name) return j;
  return -1;
}
function mesoSetsOf(d, i){
  const out = [];
  for(let j = 0; j < 12; j++){ const w = d['e' + i + 's' + j + 'w'], r = d['e' + i + 's' + j + 'r']; if(w || r) out[j] = { w: w || '', r: r || '' }; }
  if(out.length) return out;
  return String(d['e' + i + 'r'] || '').split(',').map(x => x.trim()).filter(Boolean).map(r => ({ w: d['e' + i + 'w'] || '', r }));
}
// logFor(w, d) → that session's data or null; escFn escapes; nowWeek highlights the current week.
// "205 × 10/8/6" when the weight holds; "190×8 · 175×9" when it changes.
function compactSets(sets){
  const s = (sets || []).filter(Boolean).filter(x => x.w || x.r);
  if(!s.length) return '';
  const ws = s.map(x => x.w || '');
  if(ws.every(w => w && w === ws[0])) return `${ws[0]} × ${s.map(x => x.r || '—').join('/')}`;
  return s.map(x => x.w && x.r ? `${x.w}×${x.r}` : (x.r || x.w)).join(' · ');
}

const MUSCLE_OF = { 'Horizontal Press':'Chest', 'Incline Press':'Chest', 'Horizontal Pull':'Back', 'Vertical Pull':'Back',
  'Side Delts':'Side Delts', 'Rear Delts':'Rear Delts', 'Triceps':'Triceps', 'Biceps':'Biceps', 'Quad':'Quads',
  'Hamstrings':'Hamstrings', 'Hip Hinge':'Hamstrings', 'Glutes':'Glutes', 'Calves':'Calves', 'Abs':'Abs', 'Forearms':'Forearms' };
const MUSCLE_ORDER = ['Chest','Back','Side Delts','Rear Delts','Triceps','Biceps','Quads','Hamstrings','Glutes','Calves','Abs','Forearms'];
// Sets per muscle group per week: prescribed, and what he logged (sets with reps written down).
function mesoVolumeHtml(tp, logFor, escFn, nowWeek){
  const W = (tp.weeks || []).length, pres = {}, done = {};
  (tp.days || []).forEach((day, di) => {
    if(day.rest) return;
    (tp.weeks || []).forEach((_, wi) => {
      const l = logFor(wi, di);
      (day.ex || []).forEach((e, i) => {
        const g = MUSCLE_OF[e.cat] || e.cat || 'Other';
        pres[g] = pres[g] || Array(W).fill(0); done[g] = done[g] || Array(W).fill(null);
        pres[g][wi] += Number(((e.wk || [])[wi] || {}).sets) || 0;
        if(l){ const k = mExAt(l, e.n || e.cat, i), n = k >= 0 ? mesoSetsOf(l, k).filter(x => x && x.r).length : 0;
          done[g][wi] = (done[g][wi] || 0) + n; }
      });
    });
  });
  const groups = MUSCLE_ORDER.filter(g => pres[g]).concat(Object.keys(pres).filter(g => !MUSCLE_ORDER.includes(g)));
  if(!groups.length) return '';
  const tot = wi => groups.reduce((a, g) => a + pres[g][wi], 0);
  return `<div class="mvwrap"><table class="mv">
    <thead><tr><th>Sets per muscle group</th>${(tp.weeks || []).map((w, i) => { const c = mesoWeekColor(tp, i);
      return `<th style="background:${c.bg};color:${c.fg}">${escFn(w.label || 'Week ' + (i + 1))}${i === nowWeek ? ' •' : ''}</th>`; }).join('')}</tr></thead>
    <tbody>${groups.map(g => `<tr><td>${escFn(g)}</td>${pres[g].map((p, wi) => { const d = done[g][wi];
        return `<td>${p}${d != null ? `<small class="${d >= p ? 'ok' : 'low'}"> · ${d} done</small>` : ''}</td>`; }).join('')}</tr>`).join('')}
      <tr class="tot"><td>Total</td>${(tp.weeks || []).map((_, wi) => `<td>${tot(wi)}</td>`).join('')}</tr></tbody></table></div>`;
}
// Per-set chips: "1 205×10 · 2 205×8 · 3 200×6" — every set keeps its own weight.
function setChipsHtml(sets, escFn){

const cardioTxt = l => l && (l.c_min || l.c_type) ? [l.c_type, l.c_min && l.c_min + ' min', l.c_hr && l.c_hr + ' bpm'].filter(Boolean).join(' · ') : '';
// How many set columns a week needs: the most sets prescribed or logged in that week.
function mesoSetCols(tp, logFor, wi){
  let n = 1;
  (tp.days || []).forEach((day, di) => {
    if(day.rest) return;
    const l = logFor(wi, di);
    (day.ex || []).forEach((e, i) => {
      n = Math.max(n, Number(((e.wk || [])[wi] || {}).sets) || 0);
      const k = mExAt(l, e.n || e.cat, i);
      if(k >= 0) n = Math.max(n, mesoSetsOf(l, k).length);
    });
  });

}
function mesoGridHtml(tp, logFor, escFn, nowWeek){

    const notes = weeks.some((_, wi) => (day.notes || [])[wi]) ? `<tr class="mgcn"><td>Coach's Notes</td><td colspan="2"></td>${weeks.map((_, wi) =>
      `<td colspan="${C[wi]}" title="${escFn((day.notes || [])[wi] || '')}"><div class="cl">${escFn((day.notes || [])[wi] || '')}</div></td><td class="mgsp"></td>`).join('')}</tr>` : '';

      return `<tr><td class="mgex" title="${escFn(name)}"><div class="cl">${e.v ? `<a href="${escFn(e.v)}" data-vid="${escFn(e.v)}" data-vt="${escFn(name)}" target="_blank" rel="noopener">${escFn(name)} ▶</a>` : escFn(name)}</div></td>
        <td class="mgex c">${escFn(e.reps || '')}</td><td class="mgex c">${escFn(e.tempo || '')}</td>
        ${weeks.map((_, wi) => { const w = (e.wk || [])[wi] || {}, l = logs[wi];
          const k = mExAt(l, name, i), sets = k >= 0 ? mesoSetsOf(l, k) : [];

const mDayId = (day, di) => (day && day.id) || ('d' + di);
const mLogDid = d => d.did || ('d' + d.d);
function mSetsOf(d, i){
  const out = [];
  for(let j = 0; j < 12; j++){ const w = d['e' + i + 's' + j + 'w'], r = d['e' + i + 's' + j + 'r']; if(w || r) out[j] = { w: w || '', r: r || '' }; }

  return String(d['e' + i + 'r'] || '').split(',').map(x => x.trim()).filter(Boolean).map(r => ({ w: d['e' + i + 'w'] || '', r }));
}
const mPerf = sets => (sets || []).filter(Boolean).map(x => x.w && x.r ? `${x.w}×${x.r}` : (x.r || x.w)).join(' · ');
async function drawMesoWeek(c, b){

  const nowIdx = Math.floor((tD(tIso(new Date())) - tD(start)) / 6048e5);
  if(MW == null || MW >= tp.weeks.length) MW = Math.max(0, Math.min(tp.weeks.length - 1, nowIdx));
