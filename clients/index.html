  const logFor = di => { const e = entry(di); return e ? e.data : null; };
  const when = di => (entry(di) || {}).day || slot(di);
  const lastFor = (name, before) => {
    for(const l of logs.filter(x => x.day < before).sort((a, b) => a.day < b.day ? 1 : -1))
      for(let i = 0; i < 40; i++) if(l.data['e' + i + 'n'] === name){ const s = mSetsOf(l.data, i).filter(Boolean); if(s.length) return { day: l.day, sets: s }; }
    return null;
  };
  const vol = tp.days.reduce((a, d) => a + (d.ex || []).reduce((x, e) => x + (tNum(((e.wk || [])[wi] || {}).sets) || 0), 0), 0);
  b.innerHTML = `
    <div class="mseg"><button class="on">Week view</button><button id="msFull">Full plan</button><button id="msEdit">Edit plan</button></div>
    <div class="wtabs">${tp.weeks.map((w, i) => { const col = mesoWeekColor(tp, i);
      return `<button data-mw="${i}" class="${i === wi ? 'on' : ''}" style="background:${col.bg};color:${col.fg};border-color:${col.bg}">${esc(w.label)}${i === nowIdx ? ' •' : ''}</button>`; }).join('')}</div>
    <p class="hint" style="margin:0 0 12px"><b>${esc(tp.name || '')}</b> · ${esc(tp.progression || '')} · ${vol} sets this week${tp.weeks[wi] && tp.weeks[wi].deload && tp.deload_note ? ' · deload: ' + esc(tp.deload_note) : ''}</p>
    ${tp.days.map((day, di) => {
      if(day.rest){ const cl = logFor(di); return `<div class="sect mwrest"><b>${esc(day.name)}</b>${cardioTxt(cl) ? ` <span class="hint">· 🏃 ${esc(cardioTxt(cl))}</span>` : ''}</div>`; }
      const lg = logFor(di), note = (day.notes || [])[wi];
      // one weight box + one reps box per set — as many as the most sets on this day
      const nS = Math.min(8, Math.max(1, ...(day.ex || []).map((e, i) => Math.max(Number(((e.wk || [])[wi] || {}).sets) || 0,
        (k => k >= 0 ? mSetsOf(lg, k).length : 0)(mExAt(lg, e.n || e.cat, i))))));
      return `<div class="sect">
        <div class="shead"><h3>${esc(day.name)} <span class="csub">${fmtDate(when(di))}</span></h3>
          <span class="hint">${lg ? `✓ logged${lg.sf ? ' · Fatigue: <b>' + esc(lg.sf) + '</b>' : ''}${lg.sp ? ' · Pump: <b>' + esc(lg.sp) + '</b>' : ''}${cardioTxt(lg) ? ' · 🏃 <b>' + esc(cardioTxt(lg)) + '</b>' : ''}` : 'not logged yet'}</span></div>
        ${note ? `<p class="hint" style="margin:0 0 8px">Coach's Notes: <b style="color:var(--fg)">${esc(note)}</b></p>` : ''}
        <div style="overflow-x:auto"><table class="mweek">
          <thead><tr><th rowspan="2">Exercise</th><th rowspan="2" class="c">Reps</th><th rowspan="2" class="c">Tempo</th><th rowspan="2" class="c">RIR</th><th rowspan="2" class="c">Sets</th>
            ${[...Array(nS)].map((_, j) => `<th colspan="2" class="c setg">Set ${j + 1}</th>`).join('')}<th rowspan="2">Last session</th><th rowspan="2">Notes</th></tr>
            <tr>${[...Array(nS)].map(() => '<th class="c cw">lb</th><th class="c cr">reps</th>').join('')}</tr></thead>
          <tbody>${(day.ex || []).map((e, i) => { const w = (e.wk || [])[wi] || {}, name = e.n || e.cat;
            const k = mExAt(lg, name, i), mine = k >= 0 ? mSetsOf(lg, k) : [];
            const last = lastFor(name, when(di));
            const nt = k >= 0 ? lg['e' + k + 'x'] || '' : '';
            return `<tr><td title="${esc(name)}"><div class="cl">${e.v ? `<a href="${esc(e.v)}" target="_blank" rel="noopener">${esc(name)} ↗</a>` : esc(name)}</div></td>
              <td class="c">${esc(e.reps || '')}</td><td class="c">${esc(e.tempo || '')}</td><td class="c">${esc(w.rir ?? '')}</td><td class="c">${esc(w.sets ?? '')}</td>
              ${[...Array(nS)].map((_, j) => { const x = mine[j] || {}; return `<td class="c cw">${esc(x.w || '')}</td><td class="c cr">${esc(x.r || '')}</td>`; }).join('')}
              <td class="lastc">${last ? `${setChipsHtml(last.sets, esc)}<span class="csub">${fmtDate(last.day)}</span>` : '<span class="csub">—</span>'}</td>
              <td class="nt" title="${esc(nt)}"><div class="cl">${esc(nt)}</div></td></tr>`; }).join('')}</tbody></table></div>
        ${lg && lg.notes ? `<p class="hint" style="margin:8px 0 0">Session notes: <b style="color:var(--fg)">${esc(lg.notes)}</b></p>` : ''}
      </div>`;
    }).join('')}
    ${mesoVolumeHtml(tp, (w, d) => { const id = mDayId(tp.days[d], d); const l = logs.find(x => x.data.w === w && mLogDid(x.data) === id); return l ? l.data : null; }, esc, nowIdx)}`;
  $$('#pBody [data-mw]').forEach(btn => btn.onclick = () => { MW = +btn.dataset.mw; drawMesoWeek(c, b); });
  $('#msEdit').onclick = () => { MESO_MODE = 'edit'; drawTraining(c, b); };
  $('#msFull').onclick = () => { MESO_MODE = 'full'; drawTraining(c, b); };
}

function drawMeso(c, b){
  if(!EX_CUSTOM){ loadExCustom().then(() => { if(OPEN === c && TAB === 'training' && MESO_MODE === 'edit') drawMeso(c, b); }); }
  const tp = c.sections.training_plan;
  tp.weeks = tp.weeks || []; tp.days = tp.days || [];
  const nW = tp.weeks.length;
  // Every day keeps a permanent id so logged sessions follow it when days move.
  tp.days.forEach((d, i) => { if(!d.id) d.id = 'd' + i; });
  tp.days.forEach(d => { d.ex = d.ex || []; d.notes = d.notes || []; d.ex.forEach(e => { e.wk = e.wk || []; for(let i = 0; i < nW; i++) e.wk[i] = e.wk[i] || { rir:'', sets:'' }; }); });
  const nowIdx = tp.start ? Math.floor((tD(tIso(new Date())) - tD(tMon(tp.start))) / 6048e5) : null;
  const vol = w => tp.days.reduce((a, d) => a + (d.ex || []).reduce((x, e) => x + (tNum((e.wk[w] || {}).sets) || 0), 0), 0);
  const cats = () => Object.keys(EX_LIB);
  const exOpts = e => {
    const list = EX_LIB[e.cat] || [];
    const known = list.some(([n]) => n === e.n);
    return `<option value="">— pick ${esc(e.cat || 'exercise')} —</option>` + list.map(([n, , tag]) => `<option value="${esc(n)}" ${n === e.n ? 'selected' : ''}>${esc(n)}${tag ? ' ★' : ''}</option>`).join('') +
      (e.n && !known ? `<option selected>${esc(e.n)}</option>` : '') + '<option value="__custom">+ New exercise…</option>';
  };
  const newId = () => 'd' + Math.random().toString(36).slice(2, 8);
  const blankDay = rest => ({ id: newId(), name: rest ? 'Rest / Cardio' : 'Day', rest: !!rest, ex: [], notes: [] });
  const trainingDays = tp.days.filter(d => !d.rest).length;
  b.innerHTML = `
    <div class="mseg"><button id="msWeek">Week view</button><button id="msFull">Full plan</button><button class="on">Edit plan</button></div>
    <div class="sect">
      <div class="grid2">
        <div class="fld"><label class="fl">Program name</label><input id="ms_name" value="${esc(tp.name || '')}"></div>
        <div class="fld"><label class="fl">Week 1 starts</label><input type="date" id="ms_start" value="${esc(tp.start || '')}">
          <p class="hint">${nowIdx != null ? (nowIdx < 0 ? 'Not started yet.' : nowIdx >= nW ? 'Past the last week.' : 'He is on ' + esc(tp.weeks[nowIdx].label) + ' this week.') : ''}</p></div>
      </div>
      <div class="fld"><label class="fl">Progression (shown above his program)</label><input id="ms_prog" value="${esc(tp.progression || '')}"></div>
      <label class="fl">Weeks</label>
      <div class="mweeks">${tp.weeks.map((w, i) => `<div class="r"><input data-wl="${i}" value="${esc(w.label || '')}">
        <label class="dowl"><input type="checkbox" data-wd="${i}" ${w.deload ? 'checked' : ''}>Deload</label></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" id="msAddW">+ Week</button>${nW > 1 ? '<button class="btn sm danger" id="msDelW">Remove last week</button>' : ''}</div>
      <p class="hint" style="margin-top:12px">${tp.days.length} days in the week · ${trainingDays} training · ${tp.days.length - trainingDays} rest. A week holds up to 7.</p>
    </div>
    ${tp.days.map((d, di) => `<div class="sect mday ${d.rest ? 'isrest' : ''}">
      <div class="shead">
        <div style="display:flex;gap:6px;align-items:center;flex:1">
          <span class="dnum">${di + 1}</span>
          <input data-dn="${di}" value="${esc(d.name || '')}" style="font-weight:700;max-width:320px">
        </div>
        <div class="dtools">
          <label class="sw"><input type="checkbox" data-dr="${di}" ${d.rest ? 'checked' : ''}><span class="track"></span>Rest</label>
          <button class="tlx big" data-dup="${di}" title="Move up" ${di === 0 ? 'disabled' : ''}>↑</button>
          <button class="tlx big" data-ddn="${di}" title="Move down" ${di === tp.days.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="tlx big" data-dcopy="${di}" title="Duplicate day">⧉</button>
          <button class="tlx big" data-ddel="${di}" title="Delete day">✕</button>
        </div>
      </div>
      ${d.rest ? '<p class="hint" style="margin:0">Rest / cardio — shows as a rest day on his page.</p>' : `
      <div style="overflow-x:auto"><table class="meso">
        <thead><tr><th></th><th>Muscle group</th><th>Exercise</th><th></th><th>Reps</th><th>Tempo</th>${tp.weeks.map((w, i) => { const col = mesoWeekColor(tp, i);
          return `<th colspan="2" style="background:${col.bg};color:${col.fg}">${esc(w.label)}<br><span>RIR · Sets</span></th>`; }).join('')}<th></th></tr></thead>
        <tbody>${d.ex.map((e, ei) => `<tr>
          <td class="mv2"><button class="tlx" data-eup="${di}.${ei}" ${ei === 0 ? 'disabled' : ''} title="Move up">↑</button><button class="tlx" data-edn="${di}.${ei}" ${ei === d.ex.length - 1 ? 'disabled' : ''} title="Move down">↓</button></td>
          <td><select data-ec="${di}.${ei}">${cats().map(cat => `<option ${cat === e.cat ? 'selected' : ''}>${esc(cat)}</option>`).join('')}
            ${e.cat && !cats().includes(e.cat) ? `<option selected>${esc(e.cat)}</option>` : ''}<option value="__newcat">+ New muscle group…</option></select></td>
          <td><select data-en="${di}.${ei}">${exOpts(e)}</select></td>
          <td>${e.v ? `<a href="${esc(e.v)}" target="_blank" rel="noopener" title="Video">↗</a>` : ''}</td>
          <td><input data-er="${di}.${ei}" value="${esc(e.reps || '')}" class="sm"></td>
          <td><input data-et="${di}.${ei}" value="${esc(e.tempo || '')}" class="sm"></td>
          ${e.wk.map((w, wi) => `<td><input data-wr="${di}.${ei}.${wi}" value="${esc(w.rir ?? '')}" class="xs"></td>
            <td><input data-ws="${di}.${ei}.${wi}" value="${esc(w.sets ?? '')}" class="xs"></td>`).join('')}
          <td class="mv2"><button class="tlx" data-excopy="${di}.${ei}" title="Duplicate">⧉</button><button class="tlx" data-exdel="${di}.${ei}" title="Delete">✕</button></td></tr>`).join('')}
          <tr class="cn"><td></td><td colspan="5"><b>Coach's Notes</b></td>${tp.weeks.map((w, wi) => `<td colspan="2"><textarea data-cn="${di}.${wi}" rows="2">${esc(d.notes[wi] || '')}</textarea></td>`).join('')}<td></td></tr>
          <tr class="cn"><td></td><td colspan="5" class="hint">Sets</td>${tp.weeks.map((w, wi) => `<td colspan="2" class="hint">${d.ex.reduce((a, e) => a + (tNum((e.wk[wi] || {}).sets) || 0), 0)}</td>`).join('')}<td></td></tr>
        </tbody></table></div>
      <button class="tladd" data-exadd="${di}">+ exercise</button>`}
    </div>
    <div class="dins"><button class="tladd" data-insrest="${di}">+ Rest day here</button><button class="tladd" data-instrain="${di}">+ Training day here</button></div>`).join('')}
    ${tp.days.length ? '' : `<div class="dins"><button class="tladd" data-insrest="-1">+ Rest day</button><button class="tladd" data-instrain="-1">+ Training day</button></div>`}
    <div class="sect">
      <span class="hint">Volume (total sets): ${tp.weeks.map((w, wi) => `${esc(w.label)} <b>${vol(wi)}</b>`).join(' · ')}</span>
      ${mesoVolumeHtml(tp, () => null, esc, nowIdx)}
    </div>
    <div style="display:flex;justify-content:space-between"><span class="hint">Edits are kept as you type. Hit Save to publish them to his page.</span>
      <button class="btn sm danger" id="tpRemove">Remove program</button></div>`;

  const redraw = () => { const st = $('#pBody').scrollTop; drawTraining(c, b); $('#pBody').scrollTop = st; };
  const ix = s => s.split('.').map(Number);
  const swap = (arr, i, j) => { if(j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  $('#msWeek').onclick = () => { MESO_MODE = 'week'; drawTraining(c, b); };
  $('#msFull').onclick = () => { MESO_MODE = 'full'; drawTraining(c, b); };
  $('#ms_name').oninput = e => { tp.name = e.target.value; };
  $('#ms_start').onchange = e => { tp.start = e.target.value ? tMon(e.target.value) : ''; redraw(); };
  $('#ms_prog').oninput = e => { tp.progression = e.target.value; };
  $$('#pBody [data-wl]').forEach(i => i.oninput = () => { tp.weeks[+i.dataset.wl].label = i.value; });
  $$('#pBody [data-wd]').forEach(i => i.onchange = () => { tp.weeks[+i.dataset.wd].deload = i.checked; redraw(); });
  $('#msAddW').onclick = () => { tp.weeks.push({ label: 'Week ' + (nW + 1) }); redraw(); };
  if($('#msDelW')) $('#msDelW').onclick = () => { if(!confirm('Remove ' + tp.weeks[nW - 1].label + '?')) return; tp.weeks.pop(); tp.days.forEach(d => { (d.ex || []).forEach(e => e.wk.length = nW - 1); (d.notes || []).length = Math.min((d.notes || []).length, nW - 1); }); redraw(); };
  // days
  $$('#pBody [data-dn]').forEach(i => i.oninput = () => { tp.days[+i.dataset.dn].name = i.value; });
  $$('#pBody [data-dr]').forEach(i => i.onchange = () => { tp.days[+i.dataset.dr].rest = i.checked; redraw(); });
  $$('#pBody [data-dup]').forEach(btn => btn.onclick = () => { const i = +btn.dataset.dup; swap(tp.days, i, i - 1); redraw(); });
  $$('#pBody [data-ddn]').forEach(btn => btn.onclick = () => { const i = +btn.dataset.ddn; swap(tp.days, i, i + 1); redraw(); });
  $$('#pBody [data-dcopy]').forEach(btn => btn.onclick = () => {
    if(tp.days.length >= 7) return alert('A week holds 7 days. Remove one first.');
    const i = +btn.dataset.dcopy, cp = JSON.parse(JSON.stringify(tp.days[i]));
    cp.id = newId(); cp.name = (cp.name || 'Day') + ' (copy)';
    tp.days.splice(i + 1, 0, cp); redraw();
  });
  $$('#pBody [data-ddel]').forEach(btn => btn.onclick = () => { const d = tp.days[+btn.dataset.ddel]; if(!confirm(`Remove ${d.name || 'this day'}? Sessions he already logged for it stay stored.`)) return; tp.days.splice(+btn.dataset.ddel, 1); redraw(); });
  const insert = (after, rest) => {
    if(tp.days.length >= 7) return alert('A week holds 7 days. Remove one first.');
    const d = blankDay(rest);
    if(!rest) d.name = 'Day ' + (tp.days.filter(x => !x.rest).length + 1);
    tp.days.splice(after + 1, 0, d); redraw();
  };
  $$('#pBody [data-insrest]').forEach(btn => btn.onclick = () => insert(+btn.dataset.insrest, true));
  $$('#pBody [data-instrain]').forEach(btn => btn.onclick = () => insert(+btn.dataset.instrain, false));
  // exercises
  const ex = s => { const [a, z] = ix(s); return tp.days[a].ex[z]; };
  $$('#pBody [data-ec]').forEach(i => i.onchange = async () => {
    const e = ex(i.dataset.ec);
    if(i.value === '__newcat'){
      const n = prompt('New muscle group (e.g. Traps, Adductors, Neck):', ''); if(!n || !n.trim()){ redraw(); return; }
      const cat = n.trim();
      if(!EX_LIB[cat]) await addCategory(cat);
      e.cat = cat; e.n = ''; e.v = '';
    } else { e.cat = i.value; e.n = ''; e.v = ''; }
    redraw();
  });
  $$('#pBody [data-en]').forEach(i => i.onchange = () => {
    const e = ex(i.dataset.en);
    if(i.value === '__custom'){
      const n = prompt(`New ${e.cat} exercise — name:`, ''); if(!n || !n.trim()){ redraw(); return; }
      const v = prompt('Video link (optional, YouTube plays in the pop-up):', '') || '';
      e.n = n.trim(); e.v = v.trim();
      addToLibrary(e.cat, e.n, e.v);
    } else { e.n = i.value; e.v = ((EX_LIB[e.cat] || []).find(([n]) => n === i.value) || [])[1] || ''; }
    redraw();
  });
  $$('#pBody [data-er]').forEach(i => i.oninput = () => { ex(i.dataset.er).reps = i.value; });
  $$('#pBody [data-et]').forEach(i => i.oninput = () => { ex(i.dataset.et).tempo = i.value; });
  $$('#pBody [data-wr]').forEach(i => i.oninput = () => { const [a, z, w] = ix(i.dataset.wr); tp.days[a].ex[z].wk[w].rir = i.value; });
  $$('#pBody [data-ws]').forEach(i => { i.oninput = () => { const [a, z, w] = ix(i.dataset.ws); tp.days[a].ex[z].wk[w].sets = i.value; }; i.onchange = redraw; });
  $$('#pBody [data-cn]').forEach(i => i.oninput = () => { const [a, w] = ix(i.dataset.cn); tp.days[a].notes[w] = i.value; });
  $$('#pBody [data-eup]').forEach(btn => btn.onclick = () => { const [a, z] = ix(btn.dataset.eup); swap(tp.days[a].ex, z, z - 1); redraw(); });
  $$('#pBody [data-edn]').forEach(btn => btn.onclick = () => { const [a, z] = ix(btn.dataset.edn); swap(tp.days[a].ex, z, z + 1); redraw(); });
  $$('#pBody [data-excopy]').forEach(btn => btn.onclick = () => { const [a, z] = ix(btn.dataset.excopy); tp.days[a].ex.splice(z + 1, 0, JSON.parse(JSON.stringify(tp.days[a].ex[z]))); redraw(); });
  $$('#pBody [data-exdel]').forEach(btn => btn.onclick = () => { const [a, z] = ix(btn.dataset.exdel); tp.days[a].ex.splice(z, 1); redraw(); });
  $$('#pBody [data-exadd]').forEach(btn => btn.onclick = () => {
    const d = tp.days[+btn.dataset.exadd], last = d.ex[d.ex.length - 1];
    d.ex.push({ cat: last ? last.cat : cats()[0], n: '', v: '', reps: last ? last.reps : '8-12', tempo: last ? last.tempo : '3100',
      wk: tp.weeks.map((w, wi) => last ? Object.assign({}, last.wk[wi]) : { rir:'', sets:'' }) });
    redraw();
  });
  $('#tpRemove').onclick = () => { if(!confirm('Remove the whole program? (Takes effect when you Save.)')) return; delete c.sections.training_plan; redraw(); };
}

function drawTraining(c, b){
  c.sections = c.sections || {};
  const tp = c.sections.training_plan;
  if(tp && tp.type === 'meso') return MESO_MODE === 'week' ? drawMesoWeek(c, b) : MESO_MODE === 'full' ? drawMesoFull(c, b) : drawMeso(c, b);
  if(!tp){
    b.innerHTML = `<div class="sect"><h3>No training program yet</h3>
      <p class="hint" style="margin:6px 0 14px">Build it here and he sees it on his page — each week's days, exercises and sets — and logs weights and reps per session. Old program links in the Plan tab keep working.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" id="tpMeso">Start from Mesocycle 1</button>
      <button class="btn sm" id="tpSeed">Old sheet's program</button>
      <button class="btn sm" id="tpBlank">Start blank</button></div>
      <p class="hint" style="margin-top:8px"><b>Mesocycle 1</b> is the training sheet: Upper 1 / Lower 1 / Rest / Upper 2 / Lower 2 / Rest / Full Rest, 6 weeks (3-4 RIR → … → Deload), exercises picked from the Reference library with their videos. The old program is the client sheet's Upper / Lower / Arms split.</p></div>`;
    $('#tpMeso').onclick = () => { c.sections.training_plan = Object.assign(JSON.parse(JSON.stringify(MESO_SEED)), { start: tMon(tIso(new Date())) }); MESO_MODE = 'edit'; drawTraining(c, b); };
    $('#tpSeed').onclick = () => { c.sections.training_plan = Object.assign(JSON.parse(JSON.stringify(TRAIN_SEED)), { start: tMon(tIso(new Date())) }); TW = 0; drawTraining(c, b); };
    $('#tpBlank').onclick = () => { c.sections.training_plan = { start: tMon(tIso(new Date())), budget: 16, days:[{name:'Day 1',when:''}], volume:[[]], weeks:[{label:'W1', ex:[[]]}] }; TW = 0; drawTraining(c, b); };
    return;
  }
  tp.days = tp.days || []; tp.weeks = tp.weeks || []; tp.volume = tp.volume || [];
  if(TW >= tp.weeks.length) TW = Math.max(0, tp.weeks.length - 1);
  const wk = tp.weeks[TW] || { ex: [] };
  wk.ex = wk.ex || [];
  const nowIdx = tp.start ? Math.floor((tD(tIso(new Date())) - tD(tMon(tp.start))) / 6048e5) : null;
  const sum = arr => (arr || []).reduce((a, e) => a + (tNum(e.s) || 0), 0);
  const weekTotal = wk.ex.reduce((a, d) => a + sum(d), 0);
  b.innerHTML = `
    <div class="sect">
      <div class="grid2">
        <div class="fld"><label class="fl">Week 1 starts</label><input type="date" id="tp_start" value="${esc(tp.start || '')}">
          <p class="hint">${nowIdx != null ? (nowIdx < 0 ? 'Not started yet.' : nowIdx >= tp.weeks.length ? 'Past the last week — he stays on the last one.' : 'He is on ' + esc(tp.weeks[nowIdx].label || 'W' + (nowIdx + 1)) + ' this week.') : ''}</p></div>
        <div class="fld"><label class="fl">Sets per day (volume budget)</label><input type="number" id="tp_budget" value="${tp.budget ?? ''}"></div>
      </div>
      <label class="fl">Training days</label>
      <div class="rowlist">${tp.days.map((d, i) => `<div class="r"><input data-dn="${i}" value="${esc(d.name || '')}" placeholder="Upper" style="flex:0 0 40%">
        <input data-dw="${i}" value="${esc(d.when || '')}" placeholder="Monday"><button class="btn sm danger" data-drm="${i}">✕</button></div>`).join('')}</div>
      <button class="btn sm" id="tpAddDay" style="margin-top:8px">+ Add day</button>
    </div>

    <div class="sect">
      <div class="shead"><h3>Volume plan</h3><span class="hint">Sets per muscle each day, like the top of the sheet</span></div>

// Read whatever tab is open back into OPEN, so switching tabs never loses work.
function collect(){
  const c = OPEN; if(!c) return;
  if(TAB === 'details' && $('#f_name')){
    ['name','slug','email','phone','instagram','status','client_type','pay_method','start_date','end_date','notes']
      .forEach(k => { const el = $('#f_' + k); if(el) c[k] = el.value.trim(); });
    const t = $('#f_term_months').value, a = $('#f_amount_paid').value;
    c.term_months = t === '' ? null : Number(t);
    c.amount_paid = a === '' ? null : Number(a);
  }
  if(TAB === 'plan' && $('#ph_name')){
    c.phase = {
      type: $('#ph_type').value,
      name: $('#ph_name').value.trim(),
      start: $('#ph_start') ? $('#ph_start').value : '',
      weeks: $('#ph_weeks').value === '' ? null : Number($('#ph_weeks').value),
      end: $('#ph_end') ? $('#ph_end').value : '',
      focus: $('#ph_focus').value.trim(),
      past: (c._past || []),
    };
    const num = id => { const v = $(id).value; return v === '' ? null : Number(v); };
    // Start from what's there so the tracker pieces (Timeline rows, Training, Protocols) survive.
    const sec = Object.assign({}, c.sections || {}, {
      note: { on: $('#note_on').checked, text: $('#note_text').value, at: new Date().toISOString().slice(0,10) },
      macros: {
        on: $('#mac_on').checked,
        calories: num('#mac_calories'), protein: num('#mac_protein'),
        carbs: num('#mac_carbs'), fat: num('#mac_fat'),
        note: $('#mac_note').value.trim(),
      },
      programs: (c._progs || []).filter(p => (p.name || '').trim() || (p.link || '').trim()),
    });
    SECTIONS.forEach(s => {
      sec[s.key] = {
        on: $('#s_' + s.key + '_on').checked,
        link: $('#s_' + s.key + '_link').value.trim(),
        linkLabel: $('#s_' + s.key + '_linkLabel').value.trim(),
        text: $('#s_' + s.key + '_text').value,
      };
    });
    if(c._myres) sec.my_resources = c._myres.filter(x => (x.label || '').trim() || (x.link || '').trim())
      .map(x => ({ label:(x.label || '').trim(), link:(x.link || '').trim() }));
    sec.extras = (c._extras || []).filter(x => (x.label || '').trim() || (x.link || '').trim());
    c.sections = sec;
  }
  if(TAB === 'tracking' && $('#trk_on')){
    c.sections = Object.assign({}, c.sections || {}, { tracker: { on: $('#trk_on').checked, skinfolds: $('#trk_sf').checked, checkin_day: Number($('#trk_cday').value) } });
  }
}
function upsertLocal(cl){
  const i = CLIENTS.findIndex(x => x.id === cl.id);
  if(i >= 0) CLIENTS[i] = cl; else CLIENTS.unshift(cl);
}
async function save(){
  collect();
  const c = OPEN;
  const btn = $('#pSave'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const payload = { id:c.id };
    ['slug','name','email','phone','instagram','status','client_type','start_date','term_months',
     'end_date','pay_method','amount_paid','phase','sections','notes'].forEach(k => { payload[k] = c[k] === undefined ? null : c[k]; });
    const j = await api('/clients', { method:'POST', body: JSON.stringify(payload) });
    OPEN = j.client; upsertLocal(j.client); render(); drawPanel();
    toast('Saved');
  } catch(e){ alert('Could not save: ' + e.message); }
  finally { const b2 = $('#pSave'); if(b2){ b2.disabled = false; b2.textContent = 'Save'; } }
}
async function del(){
  const c = OPEN;
  if(!confirm(`Delete ${c.name}? Their page stops working and the record is gone.`)) return;
  try {
    await api('/clients', { method:'POST', body: JSON.stringify({ action:'delete', id:c.id }) });
    CLIENTS = CLIENTS.filter(x => x.id !== c.id);
    closePanel(); render(); toast('Deleted');
  } catch(e){ alert('Could not delete: ' + e.message); }
}

// Clipboard fails whenever the doc isn't focused or perms are denied — fall back.
function copyText(t){
  const done = () => toast('Copied');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(() => legacy());
  } else legacy();
  function legacy(){
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
    ok ? done() : prompt('Copy this:', t);
  }
}
