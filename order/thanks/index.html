<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your guide is ready | TRT Guy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/editor.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--acc:#1a5cff;--acc-d:#0f3fd6;--bg:#f4f6fa;--card:#fff;--txt:#0b0d10;--mut:#5b6572;--line:rgba(11,13,16,.12);--ok:#12994a;
    --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--txt);line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:34px 18px 70px;text-align:center}
  .wordmark{display:block;height:44px;aspect-ratio:1285/602;background:url("/logo.png") center/contain no-repeat;margin:0 auto 24px;font-size:0;color:transparent;overflow:hidden}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.05;text-transform:uppercase;margin-bottom:12px}
  p{margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;margin:22px 0;text-align:left}
  .dl{display:block;background:var(--acc);color:#fff;text-decoration:none;text-align:center;border-radius:14px;margin:12px 0;
    font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;padding:16px 20px}
  .dl:hover{background:var(--acc-d)}
  .dl.bonus{background:var(--ok)}
  .mut{color:var(--mut);font-size:14px}
  .err{background:#fff5f5;border:1px solid rgba(226,72,58,.45);border-radius:12px;padding:16px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">TRT-GUY</div>
  <h1>You're In. Here's Your Guide.</h1>
  <p id="lead" class="mut">Checking your payment…</p>
  <div id="files" class="card" hidden></div>
  <div id="problem" class="err" hidden></div>
  <p class="mut">A receipt and these same links are on their way to your email. If anything does not arrive, reply to that email or write to julian@trt-guy.com and I will sort it out.</p>
</div>
<script>
const API = 'https://trt-guy-onboarding.julianhierro.workers.dev';
const TEST = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && /[?&]test=1/.test(location.search);
const pi = new URLSearchParams(location.search).get('pi')
        || new URLSearchParams(location.search).get('payment_intent');
const $ = id => document.getElementById(id);

const EDITING = /[?&]edit=1/.test(location.search);

if (EDITING) {
  // Nothing has been paid for in the editor, so show the delivered state —
  // otherwise there is only an error message to look at.
  $('lead').textContent = 'Payment confirmed. Both files are yours to keep — download them now.';
  $('files').hidden = false;
  $('files').innerHTML =
    '<a class="dl" href="#">The Sports TRT Guide ↓</a>' +
    '<a class="dl bonus" href="#">Bonus: The Fertility Guide ↓</a>';
} else if (!pi) {
  $('lead').hidden = true;
  $('problem').hidden = false;
  $('problem').innerHTML = "<b>We could not find your order reference.</b><br>If you have just paid, check your email for the receipt — or write to julian@trt-guy.com and I will send your files straight over.";
} else {
  // The worker re-checks with Stripe that this really was paid before it hands
  // anything over, so a guessed reference gets nothing.
  fetch(API + '/pay-done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentIntentId: pi, test: TEST }) })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok || !d.success) throw new Error((d && d.error) || 'not verified');
      $('lead').textContent = 'Payment confirmed. Both files are yours to keep — download them now.';
      /* Purchase, browser side. The worker already sent its own copy with this
         same event id, so Meta counts one conversion and keeps whichever
         signals each copy carried. */
      try {
        if (d.pixel && window.fbq) {
          fbq('track', 'Purchase',
              { value: d.pixel.value, currency: d.pixel.currency, content_name: d.pixel.contentName,
                content_type: 'product', num_items: 1 },
              { eventID: d.pixel.eventId });
        }
      } catch (e) {}
      /* Price test: count the sale against the cell that made it. The cell
         comes back from the worker off the payment itself, so a cleared
         browser or a different device still lands on the right one. */
      try { if (d.variant && window.tgAbBuy) tgAbBuy(d.variant); } catch (e) {}
      $('files').hidden = false;
      $('files').innerHTML = (d.downloads || []).map((f, i) =>
        '<a class="dl' + (i ? ' bonus' : '') + '" href="' + f.url + '" download>' + f.label + ' ↓</a>').join('');
    })
    .catch(() => {
      $('lead').hidden = true;
      $('problem').hidden = false;
      $('problem').innerHTML = "<b>We could not confirm that payment yet.</b><br>If your card was charged, your receipt is in your email — forward it to julian@trt-guy.com and I will send the files straight over.";
    });
}
</script>
<script>
/* Page tracking — same beacon the funnel pages use, so the Control Center
   can show views → orders for this step. */
var TRACK='https://jv-dashboard-chi.vercel.app/api/pageview', PAGE_KEY='trtguy-order-thanks';
function tgv(){try{var k='tg-vid',v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v);}return v;}catch(e){return 'anon';}}
function track(e){var u=TRACK+'?p='+encodeURIComponent(PAGE_KEY)+'&e='+e+'&v='+encodeURIComponent(tgv());try{if(navigator.sendBeacon&&navigator.sendBeacon(u))return;}catch(x){}try{new Image().src=u;}catch(x){}}
track('view');track('optin');
/* The sale, logged against the sales page's own cell key — the Control
   Center reads views and buys off the same pair of keys. */
function tgAbBuy(v){ var k='trtguy-sports-trt-guide::'+String(v).toUpperCase();
  var u=TRACK+'?p='+encodeURIComponent(k)+'&e=optin&v='+encodeURIComponent(tgv());
  try{if(navigator.sendBeacon&&navigator.sendBeacon(u))return;}catch(x){}try{new Image().src=u;}catch(x){} }
</script>
<script>window.JV_EDITOR={ site:"td-order-thanks", page:1, noAuth:true, api:"https://jv-dashboard-chi.vercel.app/api/content" };</script>
<script src="/editor.js?v=3"></script>
<script src="/px.js" defer></script>
</body>
</html>
