<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Booked | TRT Guy</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="TRT Guy — Consultation Booked">
<meta property="og:image" content="https://trt-guy.com/og-image.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/editor.css?v=1">
<style>
  :root{--bg:#f4f6fa;--card:#fff;--txt:#0b0d10;--mut:#5b6572;--line:rgba(11,13,16,.12);--acc:#0b0d10;
    --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--txt);line-height:1.6;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;
    padding:40px 32px;text-align:center;box-shadow:0 18px 44px rgba(11,13,16,.10)}
  .wordmark{display:inline-block;height:clamp(40px,11vw,52px);aspect-ratio:1285/602;
    background:url("/logo.png") center/contain no-repeat;font-size:0;color:transparent;overflow:hidden;margin-bottom:22px}
  .check{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:26px;margin:0 auto 20px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7vw,38px);line-height:1.08;
    text-transform:uppercase;letter-spacing:.01em;margin-bottom:16px}
  p{color:var(--mut);font-size:16px;margin-bottom:14px}
  p.lead{color:var(--txt);font-size:17px;font-weight:500}
  a{color:var(--acc);font-weight:600}
  .rule{height:1px;background:var(--line);margin:24px 0}
  .fine{font-size:14.5px}
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">TRT-GUY</div>
    <div class="check" data-noedit>✓</div>
    <h1>Thank you for booking your consultation.</h1>
    <p class="lead">We'll meet in Google Meet. The link to join the call will be emailed to you before the call.</p>
    <div class="rule" data-noedit></div>
    <p class="fine">If you need to reschedule, just do so 24 hours in advance.</p>
    <p class="fine">If you have any questions, just email me at <a href="mailto:julian@trt-guy.com">julian@trt-guy.com</a>.</p>
  </div>

<script>
(function () {
  if (!document.body) return;
  var SKIP = { SCRIPT:1, STYLE:1, NOSCRIPT:1, TEMPLATE:1, BR:1, LINK:1, META:1, HEAD:1 };
  var SVG = "http://www.w3.org/2000/svg";
  function skip(el){ return !!(SKIP[el.tagName] || (el.namespaceURI===SVG && el.tagName.toLowerCase()!=="svg") || (el.closest && el.closest(".jv-toolbar, .jv-launcher")) || (el.closest && el.closest("[data-noedit]"))); }
  var n=0;
  Array.prototype.forEach.call(document.body.querySelectorAll("*"), function(el){ if(skip(el))return; if(!el.hasAttribute("data-eid")) el.setAttribute("data-eid","e"+(++n)); });
  var BLOCKSEL="address,article,aside,blockquote,dd,details,div,dl,dt,fieldset,figcaption,figure,footer,form,h1,h2,h3,h4,h5,h6,header,hgroup,li,main,nav,ol,p,pre,section,summary,table,tbody,td,th,thead,tr,ul";
  function isTextLeaf(el){ if(skip(el))return false; if(!(el.textContent||"").replace(/\s+/g," ").trim())return false; if(el.querySelector(BLOCKSEL))return false; var a=el.querySelectorAll("a"); if(a.length){ var c=el.cloneNode(true); Array.prototype.forEach.call(c.querySelectorAll("a"),function(x){if(x.parentNode)x.parentNode.removeChild(x);}); if(!(c.textContent||"").replace(/\s+/g," ").trim())return false; } return true; }
  (function walk(el){ var c=el.children; for(var i=0;i<c.length;i++){ var ch=c[i]; if(skip(ch))continue; if(isTextLeaf(ch)) ch.setAttribute("data-etext","1"); else walk(ch); } })(document.body);
})();
</script>
<script src="/editor.js?v=1"></script>
</body>
</html>
