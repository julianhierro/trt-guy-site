<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Survey | TRT Guy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#1a5cff; --acc-d:#0f3fd6;
    --bg:#f4f6fa; --card:#ffffff; --txt:#0b0d10; --mut:#5b6572;
    --line:rgba(11,13,16,.10); --line2:rgba(11,13,16,.16);
    --warn:#e2483a;
    --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--txt);line-height:1.55;padding:0 16px 60px}
  .wrap{max-width:720px;margin:0 auto}

  header.top{text-align:center;padding:34px 0 10px}
  .wordmark{display:inline-block;height:clamp(44px,10vw,58px);aspect-ratio:1285/602;background:url("/logo.png") center/contain no-repeat;margin:0 0 18px;font-size:0;color:transparent;overflow:hidden}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,46px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:10px 0 10px}
  .lead{color:var(--mut);font-size:16px;max-width:560px;margin:0 auto}

  section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin:16px 0;box-shadow:0 1px 2px rgba(11,13,16,.04)}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-num{font-family:var(--display);font-weight:700;font-size:15px;color:#fff;background:var(--acc);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sec-title{font-family:var(--display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}

  .field{margin-bottom:22px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
  .req{color:var(--acc)}
  .hint{color:var(--mut);font-size:13px;margin:-4px 0 9px}
  input[type=text],input[type=email],textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--txt);
    font-family:var(--body);font-size:16px;line-height:1.5;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,92,255,.14)}
  textarea{resize:vertical;display:block}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .minilab{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}

  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:flex;gap:11px;align-items:center;border:1px solid var(--line2);border-radius:11px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
  .choice:hover{border-color:var(--acc)}
  .choice input{accent-color:var(--acc);width:18px;height:18px;flex:0 0 auto}
  .choice:has(input:checked){border-color:var(--acc);background:rgba(26,92,255,.05)}
  .choice .opt{flex:1}
  .choice b{font-weight:500;font-size:15px}

  .cond{display:none}
  .cond.on, body.jv-editing .cond{display:block}

  .actions{margin:22px 0 0;text-align:center}
  .err{color:var(--warn);font-weight:600;font-size:14px;min-height:20px;margin-bottom:8px}
  .submit{width:100%;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;padding:16px 20px;
    font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--acc-d)}
  .submit:hover{filter:brightness(1.06)}
  .submit:disabled{opacity:.6;cursor:default}
  .done{text-align:center;padding:40px 22px}
  .done p{color:var(--mut);margin-top:8px}

  @media (max-width:520px){
    section.card{padding:20px 16px}
    .trio{gap:8px}
  }
</style>
