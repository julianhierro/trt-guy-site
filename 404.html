<!doctype html>
<html lang="en" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRT Guy</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* This file is the site's 404 page AND the client plan app: GitHub Pages serves
     it for any unmatched path, so trt-guy.com/<first-name> lands here and the
     script below resolves that name against the client roster. Anything that
     isn't a client falls through to the plain not-found card. */
  :root{
    --bg:#ffffff; --bg-2:#f4f5f7; --card:#ffffff;
    --line:rgba(11,13,16,.10); --line-2:rgba(11,13,16,.16);
    --txt:#0b0d10; --mut:#5b6572;
    --acc:#0b0d10; --acc-d:#000000; --acc-soft:rgba(11,13,16,.06);
    --good:#0b0d10;
    --shadow:0 18px 44px rgba(11,13,16,.12);
    --r:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html.boot body{visibility:hidden}
  html,body{margin:0;padding:0;background:var(--bg-2);color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  body{padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--acc)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  .logo{height:26px;aspect-ratio:1285/602;background:url('/logo.png') center/contain no-repeat;
    display:inline-block;font-size:0;color:transparent;overflow:hidden}

  /* header */
  header.bar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
    padding:calc(12px + env(safe-area-inset-top)) 0 12px}
  header.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .who{font-size:13px;color:var(--mut);font-weight:600}
  .who b{color:var(--txt)}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;
    box-shadow:var(--shadow)}
  .lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--mut)}

  /* gate */
  .center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .gate{width:100%;max-width:390px;text-align:center}
  .gate .logo{height:30px;margin-bottom:22px}
  .gate h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
  .gate p{color:var(--mut);font-size:14.5px;margin:0 0 20px}
  .pin{width:100%;text-align:center;font:700 30px/1 'Inter',sans-serif;letter-spacing:.4em;text-indent:.4em;
    padding:16px 12px;border:1px solid var(--line-2);border-radius:14px;background:#fff;color:var(--txt);outline:0}
  .pin:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
  .err{color:var(--txt);font-size:13.5px;margin:12px 0 0;min-height:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;
    border:0;border-radius:13px;padding:15px 20px;font:700 15.5px Inter,sans-serif;cursor:pointer;
    text-decoration:none;width:100%;margin-top:14px;transition:background .15s}
  .btn:hover{background:var(--acc-d)}
  .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line-2)}
  .btn.ghost:hover{background:var(--bg-2)}

  /* phase */
  main{padding:20px 0 40px}
  .phase{margin-bottom:16px}
  .phase h1{font-size:23px;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.2}
  .phase .dates{font-size:13.5px;color:var(--mut)}
  .phase .focus{margin:14px 0 0;font-size:15px;color:var(--txt);white-space:pre-wrap}
  .prog{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin:16px 0 8px}
  .prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
  .progtxt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
  .weeksin{margin-top:12px;font-size:14px;color:var(--mut)}
  .weeksin b{color:var(--txt);font-weight:700}

  /* a note from Julian — the first thing he reads when it is there */
  .note{margin-bottom:16px;border-color:var(--line-2);background:var(--acc-soft)}
  .note .body{margin-top:8px;font-size:15px;color:var(--txt)}
  .note .body p:last-child,.note .body ul:last-child,.note .body ol:last-child{margin-bottom:0}

  /* macros — the numbers he opens the app for */
  .macros{margin-bottom:16px;padding:18px 20px}
  .macros .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .macros .m{text-align:center}
  .macros .m b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
  .macros .m span{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;font-size:11px;color:var(--mut);margin-top:2px}
  .macros .note{margin:14px 0 0;font-size:13px;color:var(--mut)}
  @media(max-width:380px){ .macros .row{grid-template-columns:repeat(2,1fr);gap:14px} }

  /* history */
  .past{margin-bottom:16px}
  .past summary{cursor:pointer;font-size:13.5px;color:var(--mut);padding:6px 2px;list-style:none}
  .past summary::-webkit-details-marker{display:none}
  .past summary:before{content:'▸ ';color:var(--mut)}
  .past[open] summary:before{content:'▾ '}
  .past ul{margin:6px 0 0;padding:0 0 0 18px;font-size:13.5px;color:var(--mut)}
  .past li{margin:0 0 5px}
  .past li b{color:var(--txt);font-weight:600}
  .oldprog{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;background:var(--card);margin-bottom:8px;text-decoration:none;color:inherit}
  .oldprog .t b{display:block;font-size:14.5px}
  .oldprog .t span{display:block;font-size:12.5px;color:var(--mut)}
  .oldprog .go{color:var(--mut)}
  .curprog{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card);margin-bottom:18px}
  .curprog .lbl{margin-bottom:4px}
  .curprog h2{margin:0 0 2px;font-size:18px;letter-spacing:-.01em}
  .curprog .dates{font-size:13px;color:var(--mut)}

  /* tiles */
  .tiles{display:grid;gap:10px;margin-top:6px}
  .tile{display:flex;align-items:center;gap:14px;border-left:3px solid transparent;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;cursor:pointer;font:inherit;
    color:inherit;text-decoration:none;transition:border-color .15s,transform .06s}
  .tile:hover{border-color:var(--acc);border-left-color:var(--acc)}
  .tile:active{transform:scale(.995)}
  .tile .t{flex:1;min-width:0}
  .tile .t b{display:block;font-size:16.5px;letter-spacing:-.01em}
  .tile .t span{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .go{color:var(--mut);font-size:20px;line-height:1}

  /* section view */
  .sview h1{font-size:24px;letter-spacing:-.02em;margin:2px 0 14px}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:8px 0;margin:0 0 4px;
    color:var(--mut);font:600 14px Inter,sans-serif;cursor:pointer}
  .body{font-size:15.5px;color:var(--txt)}
  .body h3{font-size:17px;margin:22px 0 8px;letter-spacing:-.01em}
  .body p{margin:0 0 12px}
  .body ul,.body ol{margin:0 0 14px;padding-left:22px}
  .body li{margin:0 0 6px}
  .body strong{font-weight:700}
  .updated{font-size:12.5px;color:var(--mut);margin-top:26px}

  /* edit mode — Julian only */
  /* keep each element's own display — overriding it reflowed the tiles */
  body.tg-edit [data-copy]{outline:1px dashed rgba(11,13,16,.5);outline-offset:3px;border-radius:3px;cursor:text}
  body.tg-edit [data-copy]:empty{min-width:40px;display:inline-block}
  body.tg-edit .tile{pointer-events:none}
  body.tg-edit .tile [data-copy]{pointer-events:auto}
  body.tg-edit [data-copy]:focus{outline:2px solid var(--acc);background:var(--acc-soft)}
  body.tg-edit{padding-bottom:96px}
  .editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:99;display:flex;gap:8px;
    align-items:center;background:#0b0d10;color:#fff;border-radius:14px;padding:10px 12px;
    box-shadow:0 14px 40px rgba(11,13,16,.4);font-size:13.5px;max-width:calc(100% - 24px)}
  .editbar button{background:#20242b;color:#fff;border:0;border-radius:9px;padding:9px 13px;
    font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
  .editbar button.go{background:#fff;color:#0b0d10}
  .editbar button:hover{filter:brightness(1.15)}
  .editbar span{padding:0 4px;color:#aeb6c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* additional resources — a menu that opens in place */
  .resbox{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden}
  .resbox summary{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:17px 18px;cursor:pointer;list-style:none;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .resbox summary::-webkit-details-marker{display:none}
  .resbox summary .go{color:var(--mut);font-size:20px;line-height:1;transition:transform .18s}
  .resbox[open] summary .go{transform:rotate(90deg)}
  .resbox[open] summary{border-bottom:1px solid var(--line)}
  .resbox a{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 18px;text-decoration:none;color:inherit;font-size:14.5px;font-weight:500;
    border-bottom:1px solid var(--line)}
  .resbox a:last-child{border-bottom:0}
  .resbox a:hover{background:var(--bg-2)}
  .resbox a .go{color:var(--mut)}
  .resbox .res-soon{display:block;padding:14px 18px;border-bottom:1px solid var(--line);
    font-size:14.5px;font-weight:500;color:var(--mut)}
  .resbox .res-soon:last-child{border-bottom:0}

  /* check-in tracker */
  .wk{margin-bottom:16px}
  .wk .sub{font-size:13.5px;color:var(--mut);margin-top:2px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
  .days button{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:8px 0 7px;cursor:pointer;
    font:600 11.5px Inter,sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:5px}
  .days button i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);display:block}
  .days button.on i{background:var(--acc);border-color:var(--acc)}
  .days button.today{border-color:var(--acc);color:var(--txt)}
  .days button:disabled{opacity:.4;cursor:default}
  .stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 2px}
  .stats4 .s b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .stats4 .s span{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;font-size:10.5px;color:var(--mut)}
  .stats4 .s em{display:block;font-style:normal;font-size:11.5px;color:var(--mut)}
  @media(max-width:420px){ .stats4{grid-template-columns:repeat(2,1fr);gap:12px} }
  .wk .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wk .btns .btn{margin-top:14px;padding:13px 12px;font-size:14.5px}
  .spark{margin-top:14px;display:block;width:100%;height:56px}
  .linkbtn{background:none;border:0;padding:12px 0 0;color:var(--mut);font:600 13.5px Inter,sans-serif;cursor:pointer;text-decoration:underline}
  .dnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
  .dnav b{font-size:15.5px}
  .dnav button{border:1px solid var(--line-2);background:#fff;border-radius:10px;width:42px;height:38px;font-size:18px;cursor:pointer;color:var(--txt)}
  .dnav button:disabled{opacity:.3;cursor:default}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fgrid.three{grid-template-columns:1fr 1fr 1fr}
  .f label{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
  .f label small{font-weight:500;color:var(--mut)}
  .f input,.f textarea,.q textarea{width:100%;border:1px solid var(--line-2);border-radius:11px;padding:12px;
    font:500 16px Inter,sans-serif;color:var(--txt);background:#fff;outline:0}
  .f input:focus,.f textarea:focus,.q textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .f textarea,.q textarea{min-height:84px;resize:vertical;line-height:1.5}
  .grp{margin:22px 0 10px}
  .q{margin:0 0 20px}
  .q .qt{font-size:14.5px;font-weight:600;margin:0 0 4px;white-space:pre-wrap}
  .q .qh{font-size:12.5px;color:var(--mut);margin:0 0 8px;white-space:pre-wrap}
  .opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .opts button{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:10px 13px;
    font:500 14px Inter,sans-serif;color:var(--txt);cursor:pointer;text-align:left}
  .opts.col{flex-direction:column}
  .opts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .saved{font-size:13px;color:var(--mut);text-align:center;margin-top:10px;min-height:18px}
  .hist{width:100%;border-collapse:collapse;font-size:13px}
  .hist th{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--mut);text-align:right;padding:0 6px 8px;white-space:nowrap}
  .hist th:first-child,.hist td:first-child{text-align:left}
  .hist td{border-top:1px solid var(--line);padding:10px 6px;text-align:right;white-space:nowrap}
  .histwrap{overflow-x:auto;margin:0 -4px}
  .hist tr[data-wv],.hist tr.tap{cursor:pointer}
  .hist tr[data-wv]:hover td,.hist tr.tap:hover td{background:var(--bg-2)}
  .hist.wv tr.now td{background:var(--acc-soft)}
  .hist.wv tr.fut td{color:var(--line-2)}
  .hist.wv td small{color:var(--mut);font-size:11px}
  .hist.wv tr.nrow td{border-top:0;padding-top:0;text-align:left;white-space:normal;color:var(--mut);font-size:12.5px}
  .hist.wv tr.avg td{border-top:2px solid var(--line-2);font-weight:700}
  .hist.wv tr.tg td{color:var(--mut)}
  .links{display:flex;gap:18px}
  .wvq{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px 14px;margin-top:10px}
  .wvq span{display:block;font-size:11.5px;color:var(--mut)}
  .wvq b{font-size:14px;font-weight:600}

  .btn.sm{width:auto;padding:10px 14px;font-size:13.5px;margin-top:12px}
  .doses{display:grid;gap:7px}
  .dose{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;
    font-size:14.5px;cursor:pointer;background:#fff}
  .dose input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--acc);flex:0 0 auto}
  .dose small{color:var(--mut)}
  .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pic{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--line-2);border-radius:12px;overflow:hidden;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#fff;text-decoration:none;color:var(--mut)}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pic .plus{font-size:26px}
  .pic .pl{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.9);color:var(--txt);font-size:11.5px;
    font-weight:600;border-radius:6px;padding:2px 7px}
  .pic.busy{opacity:.5}
  .picrow{margin-bottom:14px}
  .picrow .sub{margin-bottom:6px}
  .howto{margin:0 0 12px;font-size:13.5px;color:var(--mut)}
  .howto summary{cursor:pointer;font-weight:600;color:var(--txt);margin-bottom:6px}
  .howto p{margin:0 0 8px}
  .tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:75vh}
  table.tl{border-collapse:separate;border-spacing:0;font-size:12.5px}
  table.tl th{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;padding:7px 12px;white-space:nowrap;
    border-right:1px solid var(--line);z-index:1;max-width:170px;overflow:hidden;text-overflow:ellipsis}
  table.tl td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap;min-width:78px;text-align:center}
  table.tl tr th{border-top:1px solid var(--line)}
  table.tl th{box-shadow:-4px 0 0 #fff}
  @media(max-width:520px){ table.tl th{max-width:124px;padding:7px 8px;font-size:12px} table.tl td{min-width:64px;padding:7px 6px} }
  table.tl td.now{background:var(--acc-soft);font-weight:700}
  table.tl tr.tlg th{font-family:'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;font-size:11px;
    color:var(--mut);background:var(--bg-2)}
  table.tl tr.tlg td{background:var(--bg-2)}
  .carried{color:var(--mut);font-weight:400}
  .wtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
  .wtabs button{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:8px 12px;font:600 13px Inter,sans-serif;cursor:pointer;color:var(--txt)}
  .wtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tday{margin-bottom:10px;padding:16px 18px}
  .tdh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .exl{margin:10px 0 0;padding-left:20px;font-size:14.5px}
  .exl li{margin:0 0 6px}
  .exl li span.sub{margin-left:6px;font-size:12.5px;color:var(--mut)}
  .pday{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
  .pday.now{border-color:var(--acc)}
  .pdh{font-weight:700;font-size:14px;margin-bottom:8px}
  .pday .dose{margin-top:6px}
  table.ptab td{white-space:normal;min-width:80px}

  .a2hs{display:flex;gap:12px;align-items:flex-start;background:var(--acc-soft);border:1px solid rgba(11,13,16,.16);
    border-radius:14px;padding:14px 16px;margin-top:18px;font-size:13.5px;color:var(--txt)}
  .a2hs button{background:none;border:0;color:var(--txt);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
  footer.f{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 0 34px}

  /* Desktop: give the plan room to breathe instead of a phone-width column */
  @media(min-width:760px){
    .wrap{max-width:880px;padding:0 24px}
    main{padding:30px 0 56px}
    .card{padding:26px 28px}
    .phase h1{font-size:28px}
    .tiles{grid-template-columns:1fr 1fr;gap:12px}
    .macros .m b{font-size:26px}
  }
  @media(min-width:1040px){
    .wrap{max-width:960px}
  }
</style>
</head>
<body>

<!-- loading -->
<div id="vLoad" class="center"><div class="lbl">Loading…</div></div>

<!-- PIN gate -->
<div id="vGate" class="center" hidden>
  <div class="gate">
    <span class="logo">TRT Guy</span>
    <h1 id="gHi" data-copy="gate_hi">Welcome</h1>
    <p id="gSub" data-copy="gate_sub">Enter your 4-digit access code to open your plan.</p>
    <input class="pin" id="gPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="one-time-code">
    <button class="btn" id="gGo" data-copy="gate_btn">Open my plan</button>
    <p class="err" id="gErr"></p>
  </div>
</div>

<!-- not found -->
<div id="vNF" class="center" hidden>
  <div class="gate">
    <span class="logo">TRT Guy</span>
    <h1 id="nfTitle" data-copy="nf_title">Page not found</h1>
    <p id="nfBody" data-copy="nf_body">That link doesn't lead anywhere. Check the spelling, or head back to the site.</p>
    <a class="btn ghost" id="nfBtn" data-copy="nf_btn" href="https://trt-guy.com/">Go to trt-guy.com</a>
  </div>
</div>

<!-- the plan -->
<div id="vApp" hidden>
  <header class="bar"><div class="wrap in">
    <span class="logo">TRT Guy</span>
    <span class="who" id="aWho"></span>
  </div></header>
  <main class="wrap">
    <div id="aHome">
      <section class="card phase" id="aPhase"></section>
      <section class="card note" id="aNote" hidden></section>

<script>
// Build stamp. On load the page re-fetches itself past the browser cache and
// compares this value; if the copy we were handed is old, it reloads once. A
// stale cache can otherwise hide a deploy for hours without any sign.
const BUILD = '2026-10-13T15:00Z';
(async () => {
  try {
    const r = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'reload' });
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && !sessionStorage.getItem('tg-reloaded')) {
      sessionStorage.setItem('tg-reloaded', '1');
      location.reload();
    }
  } catch (e) {}
})();

const WORKER = 'https://trt-guy-onboarding.julianhierro.workers.dev';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = id => ['vLoad','vGate','vNF','vApp'].forEach(v => { $('#' + v).hidden = (v !== id); });

// The slug is the first path segment: trt-guy.com/marcus → "marcus".
const SLUG = decodeURIComponent((location.pathname.split('/').filter(Boolean)[0] || '')).toLowerCase()
  .replace(/\.html?$/, '');
const PINKEY = 'tgc-pin:' + SLUG;

// Every fixed word on this page. Julian overrides any of these from the client
// manager ("Page wording"); an override that's blank falls back to the default here.
const DEFAULT_COPY = {
  gate_hi: 'Hey {first},',
  gate_sub: 'Enter your 4-digit access code to open your plan.',
  gate_btn: 'Open my plan',
  gate_btn_busy: 'Opening…',
  gate_empty: 'Enter your 4-digit code.',
  header_who: 'Plan for {first}',
  phase_label: 'Where we are',
  phase_untitled: 'Your plan',
  week_txt: 'Week {n} of {total}',
  days_txt: '{n} days to go',
  note_label: 'Note',
  macros_label: 'Your daily numbers',
  mac_calories: 'Calories',
  mac_protein: 'Protein',
  mac_carbs: 'Carbs',
  mac_fat: 'Fat',
  past_label: "Phases you've done ({n})",
  tile_training: 'Training',              tile_training_sub: 'Your program',
  tile_daily_checkin: 'Daily Check In',   tile_daily_checkin_sub: '',
  tile_peds: 'PED Protocol',              tile_peds_sub: 'Compounds, doses, timing',
  tile_weekly_checkin: 'Weekly Check In', tile_weekly_checkin_sub: '',
  resources_label: 'Additional Resources',
  extras_sub: 'Tap to open',
  empty_plan: 'Your plan is being written up. It will appear here — nothing to do on your side.',
  back: '← Back',
  open_default: 'Open my {section}',
  prog_current_label: "Program you're on",
  prog_open_btn: 'Open the program ↗',
  prog_past_label: "Programs you've done",
  updated: 'Last updated {date}',
  a2hs_title: 'Keep this one tap away.',
  a2hs_ios: 'Tap the Share button, then “Add to Home Screen”.',
  a2hs_android: 'Open your browser menu and choose “Add to Home screen”.',
  footer: 'TRT Guy · Questions? Message me and I’ll sort it.',
  nf_title: 'Page not found',
  nf_body: "That link doesn't lead anywhere. Check the spelling, or head back to the site.",
  nf_btn: 'Go to trt-guy.com',
  trk_label: 'This week',
  trk_week: 'Week {n} of coaching',
  trk_log_btn: 'Log today',
  trk_log_edit: "Edit today's log",
  trk_weekly_btn: 'Weekly check-in',
  trk_weekly_done: 'Weekly check-in ✓',
  trk_history: 'See past weeks',
  trk_daily_title: 'Daily Check In',
  trk_weekly_title: 'Weekly Check In',
  trk_history_title: 'Past weeks',
  trk_measure_label: 'Measurements',
  trk_save: 'Save',
  trk_submit: 'Submit check-in',
  trk_saved: 'Saved ✓',
  trk_target: 'target {n}',
  tile_timeline: 'Timeline',              tile_timeline_sub: 'Your plan week by week',
  trk_today_label: 'Today',
  trk_pics_label: 'Progress pics',
  trk_skin_label: 'Skin folds (mm)',
  trk_train_log: 'Log this session',
  trk_weekview: 'Week view',
};
let C = Object.assign({}, DEFAULT_COPY);
// t('week_txt', {n:2, total:8}) — {placeholders} are filled from the second argument.
const t = (k, vars) => {
  const v = (C[k] == null || C[k] === '') ? DEFAULT_COPY[k] : C[k];
  return String(v == null ? '' : v).replace(/\{(\w+)\}/g, (m, key) => (vars && vars[key] != null) ? vars[key] : '');
};
async function loadCopy(){
  try {
    const r = await fetch(WORKER + '/client-copy');
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.copy) C = Object.assign({}, DEFAULT_COPY, j.copy);
  } catch(e){}
}
// The bits that live in the static markup rather than in a render function.
function paintStaticCopy(){
  $('#gSub').textContent = t('gate_sub');
  $('#gGo').textContent = t('gate_btn');
  $('#nfTitle').textContent = t('nf_title');
  $('#nfBody').textContent = t('nf_body');
  $('#nfBtn').textContent = t('nf_btn');
  $('#a2hsTitle').textContent = t('a2hs_title');
}

const meta = k => ({ name: t('tile_' + k), blurb: t('tile_' + k + '_sub') });
const ORDER = ['training','daily_checkin','peds','weekly_checkin'];

let CLIENT = null;
let RESOURCES = [];
let PIN = '';

function fmt(d){
  if(!d) return '';
  const dt = new Date(d + 'T12:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
// Julian types plain text in the manager; this renders the few marks he'd reach for.
function render(text){
  const lines = String(text || '').replace(/\r/g,'').split('\n');
  let html = '', list = null;
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const closeList = () => { if(list){ html += `</${list}>`; list = null; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l){ closeList(); continue; }
    let m;
    if((m = l.match(/^#{1,3}\s+(.*)$/))){ closeList(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if((m = l.match(/^[-*•]\s+(.*)$/))){
      if(list !== 'ul'){ closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    if((m = l.match(/^\d+[.)]\s+(.*)$/))){
      if(list !== 'ol'){ closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    closeList();
    html += `<p>${inline(l)}</p>`;
  }
  closeList();
  return html;
}

/* ── unlock ───────────────────────────────────────────────────────────────── */
async function tryPin(pin){
  const res = await fetch(WORKER + '/client', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ slug: SLUG, pin }),
  });
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(j.error || 'Something went wrong.');
  PIN = pin;
  RESOURCES = Array.isArray(j.resources) ? j.resources : [];
  return j.client;
}
async function boot(){
  await loadCopy();
  paintStaticCopy();
  if(!SLUG){ show('vNF'); document.documentElement.classList.remove('boot'); return; }

  // A code can ride in the link (?pin=1234) so one tap opens the plan.
  const urlPin = new URLSearchParams(location.search).get('pin');
  if(urlPin){
    localStorage.setItem(PINKEY, urlPin);
    history.replaceState(null, '', location.pathname);
  }
  const saved = localStorage.getItem(PINKEY);

  if(saved){
    try { CLIENT = await tryPin(saved); openApp(); return; }
    catch(e){ localStorage.removeItem(PINKEY); }
  }
  // No code yet: is this even a client page?
  let found = null;
  try {
    const r = await fetch(WORKER + '/client?slug=' + encodeURIComponent(SLUG));
    found = r.ok ? await r.json() : null;
  } catch(e){}
  document.documentElement.classList.remove('boot');
  if(!found || !found.found){ show('vNF'); if(EDIT) startEdit(); return; }
  $('#gHi').textContent = t('gate_hi', { first: found.first || '' });
  show('vGate');
  if(EDIT){ startEdit(); return; }
  setTimeout(() => $('#gPin').focus(), 120);
}
$('#gGo').onclick = async () => {
  const pin = $('#gPin').value.trim();
  if(pin.length < 4){ $('#gErr').textContent = t('gate_empty'); return; }
  const btn = $('#gGo'); btn.disabled = true; btn.textContent = t('gate_btn_busy');
  try {
    CLIENT = await tryPin(pin);
    localStorage.setItem(PINKEY, pin);
    openApp();
  } catch(e){
    $('#gErr').textContent = e.message;
    btn.disabled = false; btn.textContent = t('gate_btn');
  }
};
$('#gPin').addEventListener('keydown', e => { if(e.key === 'Enter') $('#gGo').click(); });

/* ── the plan ─────────────────────────────────────────────────────────────── */
function openApp(){
  const c = CLIENT;
  document.title = 'TRT Guy — ' + (c.first || c.name || '');
  installManifest(c);
  // Bold just the name, wherever {first} sits in his wording.
  const whoName = c.first || c.name || '';
  $('#aWho').innerHTML = esc(t('header_who', { first: '\u0001' })).replace('\u0001', '<b>' + esc(whoName) + '</b>');
  $('#aFooter').textContent = t('footer');

  // phase — we show how long they've been IN the phase, not a fixed length
  // (the plan's length can change, so a "week X of Y" would go stale).
  const ph = c.phase || {};
  const start = ph.start || c.start_date;
  let weeksIn = null;
  if(start){
    const s = new Date(start + 'T00:00:00');
    const days = Math.max(0, Math.floor((Date.now() - s) / 86400000));
    weeksIn = Math.floor(days / 7) + 1;
  }
  $('#aPhase').innerHTML = `
    <div class="lbl" data-copy="phase_label">${esc(t('phase_label'))}</div>
    <h1>${esc(ph.name || t('phase_untitled'))}</h1>
    ${start ? `<div class="dates">Started ${fmt(start)}</div>` : ''}
    ${weeksIn ? `<div class="weeksin"><b>Week ${weeksIn}</b> in this phase</div>` : ''}
    ${ph.focus ? `<div class="focus">${esc(ph.focus)}</div>` : ''}`;

  // a note from Julian, if there is one
  const note = (c.sections || {}).note || {};
  const noteOn = note.on && (note.text || '').trim();
  $('#aNote').hidden = !noteOn;
  if(noteOn){
    $('#aNote').innerHTML = `<div class="lbl" data-copy="note_label">${esc(t('note_label'))}</div>
      <div class="body">${render(note.text)}</div>`;
  }

  // macros — first numbers he sees, no tapping
  const mac = (c.sections || {}).macros || {};
  const hasMac = mac.on && [mac.calories, mac.protein, mac.carbs, mac.fat].some(v => v != null && v !== '');
  $('#aMacros').hidden = !hasMac;
  if(hasMac){
    const cell = (v, l, suffix, key) => `<div class="m"><b>${v == null || v === '' ? '—' : Number(v).toLocaleString('en-US') + (suffix || '')}</b><span data-copy="${key}">${l}</span></div>`;
    $('#aMacros').innerHTML = `
      <div class="lbl" data-copy="macros_label">${esc(t('macros_label'))}</div>
      <div class="row">
        ${cell(mac.calories, t('mac_calories'), '', 'mac_calories')}
        ${cell(mac.protein, t('mac_protein'), 'g', 'mac_protein')}
        ${cell(mac.carbs, t('mac_carbs'), 'g', 'mac_carbs')}
        ${cell(mac.fat, t('mac_fat'), 'g', 'mac_fat')}
      </div>
      ${mac.note ? `<p class="note">${esc(mac.note)}</p>` : ''}`;
  }

  // (Past phases are intentionally not shown to the client — kept in the manager only.)

  // tiles
  const secs = c.sections || {};
  if(secs.checkin && !secs.weekly_checkin) secs.weekly_checkin = secs.checkin;  // old name
  const progs = (secs.programs || []).filter(p => (p.name || '').trim() || (p.link || '').trim());
  const curProg = progs.find(p => p.current);

  // With the in-app tracker on, the check-in tiles (old sheet links) step aside.
  const trackerOn = !!(secs.tracker && secs.tracker.on);
  const tiles = ORDER.filter(k => {
    if(!secs[k] || !secs[k].on) return false;
    if(trackerOn && (k === 'daily_checkin' || k === 'weekly_checkin')) return false;
    if(trackerOn && k === 'training' && hasTrainingPlan()) return false;
    return (secs[k].link || '').trim() || (secs[k].text || '').trim() ||
           (k === 'training' && curProg && (curProg.link || '').trim());
  }).map(k => {
      const s = secs[k], m = meta(k);
      // Training opens the sheet for the block he is on; every other tile opens its own link.
      const link = (k === 'training' && curProg && (curProg.link || '').trim())
        ? curProg.link : (s.link || '').trim();
      // Every program tile shows the same simple prompt under its title.
      const inner = `<span class="t"><b data-copy="tile_${k}">${esc(m.name)}</b><span data-copy="extras_sub">${esc(t('extras_sub'))}</span></span>`;
      return link
        ? `<a class="tile" href="${esc(link)}" target="_blank" rel="noopener">${inner}<span class="go">↗</span></a>`
        : `<button class="tile" data-k="${k}">${inner}<span class="go">›</span></button>`;
    });
  // In-app tracker tiles: Timeline, the training program, each protocol.
  if(trackerOn){
    const tk = [];
    tk.push(`<button class="tile" data-tk="timeline"><span class="t"><b data-copy="tile_timeline">${esc(t('tile_timeline'))}</b><span data-copy="tile_timeline_sub">${esc(t('tile_timeline_sub'))}</span></span><span class="go">›</span></button>`);
    if(hasTrainingPlan()) tk.push(`<button class="tile" data-tk="training"><span class="t"><b data-copy="tile_training">${esc(t('tile_training'))}</b><span data-copy="tile_training_sub">${esc(t('tile_training_sub'))}</span></span><span class="go">›</span></button>`);
    activeProtocols().forEach(p => tk.push(`<button class="tile" data-tk="protocol" data-pid="${esc(p.id)}"><span class="t"><b>${esc(p.name || 'Protocol')}</b><span data-copy="extras_sub">${esc(t('extras_sub'))}</span></span><span class="go">›</span></button>`));
    tiles.unshift(...tk);
  }
  (secs.extras || []).filter(x => (x.link || '').trim()).forEach(x => {
    tiles.push(`<a class="tile" href="${esc(x.link)}" target="_blank" rel="noopener">
      <span class="t"><b>${esc(x.label || 'Open')}</b><span data-copy="extras_sub">${esc(t('extras_sub'))}</span></span><span class="go">↗</span></a>`);
  });
  $('#aTiles').innerHTML = tiles.join('') ||
    `<div class="card" style="color:var(--mut)" data-copy="empty_plan">${esc(t('empty_plan'))}</div>`;
  document.querySelectorAll('#aTiles .tile[data-k]').forEach(b => b.onclick = () => openSection(b.dataset.k));
  document.querySelectorAll('#aTiles .tile[data-tk]').forEach(b => b.onclick = () => {
    if(b.dataset.tk === 'timeline') openTimeline();
    else if(b.dataset.tk === 'training') openTraining();
    else openProtocol(b.dataset.pid);
  });

  // Additional Resources — one shared library, the worker sends what this client may see.
  const res = RESOURCES || [];
  $('#aRes').innerHTML = res.length ? `<details class="resbox">
      <summary><span data-copy="resources_label">${esc(t('resources_label'))}</span><span class="go">›</span></summary>
      ${res.map(r => (r.link || '').trim()
        ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.label)}<span class="go">↗</span></a>`
        : `<span class="res-soon">${esc(r.label)}</span>`).join('')}
    </details>` : '';

  $('#aWeek').hidden = !trackerOn;
  if(trackerOn) loadLogs();

  a2hs();
  show('vApp');
  document.documentElement.classList.remove('boot');
  if(EDIT) startEdit();
}

function openSection(k){
  const s = (CLIENT.sections || {})[k], m = meta(k);
  $('#aHome').hidden = true;
  $('#aSection').hidden = false;

  // Training carries his programs: the one he's on, then everything he's finished.
  let progHtml = '';
  if(k === 'training'){
    const progs = ((CLIENT.sections || {}).programs || []).filter(p => (p.name || '').trim() || (p.link || '').trim());
    const cur = progs.find(p => p.current);
    const old = progs.filter(p => p !== cur);
    if(cur){
      progHtml += `<div class="curprog">
        <div class="lbl" data-copy="prog_current_label">${esc(t('prog_current_label'))}</div>
        <h2>${esc(cur.name || 'Current program')}</h2>
        <div class="dates">${cur.weeks ? cur.weeks + ' weeks · ' : ''}${fmt(cur.start)}${cur.end ? ' → ' + fmt(cur.end) : ''}</div>
        ${(cur.link || '').trim() ? `<a class="btn" href="${esc(cur.link)}" target="_blank" rel="noopener" data-copy="prog_open_btn">${esc(t('prog_open_btn'))}</a>` : ''}
      </div>`;
    }
    if(old.length){
      progHtml += `<div class="lbl" style="margin:22px 0 10px" data-copy="prog_past_label">${esc(t('prog_past_label'))}</div>` +
        old.map(p => (p.link || '').trim()
          ? `<a class="oldprog" href="${esc(p.link)}" target="_blank" rel="noopener">
               <span class="t"><b>${esc(p.name || 'Program')}</b>
               <span>${p.weeks ? p.weeks + ' weeks · ' : ''}${fmt(p.start)}${p.end ? ' → ' + fmt(p.end) : ''}</span></span>
               <span class="go">↗</span></a>`
          : `<div class="oldprog"><span class="t"><b>${esc(p.name || 'Program')}</b>
               <span>${p.weeks ? p.weeks + ' weeks · ' : ''}${fmt(p.start)}${p.end ? ' → ' + fmt(p.end) : ''}</span></span></div>`).join('');
    }
  }

  $('#aSection').innerHTML = `
    <button class="back" id="sBack" data-copy="back">${esc(t('back'))}</button>
    <h1>${esc(m.name)}</h1>
    ${(s.link || '').trim()
      ? `<a class="btn" href="${esc(s.link)}" target="_blank" rel="noopener" style="margin:0 0 20px">${esc(s.linkLabel || t('open_default', { section: m.name.toLowerCase() }))} ↗</a>`
      : ''}
    <div class="body">${render(s.text)}</div>
    ${progHtml}
    ${CLIENT.updated_at ? `<p class="updated" data-copy="updated">${esc(t('updated', { date: new Date(CLIENT.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) }))}</p>` : ''}`;
  if(EDIT && document.body.classList.contains('tg-edit')) markEditable();
  $('#sBack').onclick = closeSection;
  history.pushState({ sec:k }, '', location.pathname);
  window.scrollTo(0, 0);
}
function closeSection(){
  $('#aSection').hidden = true;
  $('#aHome').hidden = false;
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { if(!$('#aSection').hidden){ closeSection(); if(!$('#aWeek').hidden) renderWeek(); } });

// Home-screen prompt: iOS has no install API, so it gets the Share-sheet wording.
function a2hs(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(standalone || localStorage.getItem('tgc-a2hs:' + SLUG)) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const howKey = ios ? 'a2hs_ios' : 'a2hs_android';
  $('#a2hsHow').setAttribute('data-copy', howKey);
  $('#a2hsHow').textContent = t(howKey);
  $('#a2hs').hidden = false;
  $('#a2hsX').onclick = () => { localStorage.setItem('tgc-a2hs:' + SLUG, '1'); $('#a2hs').hidden = true; };
}

// The manifest is generated per client so the home-screen icon opens their page.
function installManifest(c){
  try {
    const mf = {
      name: 'TRT Guy — ' + (c.first || c.name || ''),
      short_name: c.first || 'TRT Guy',
      start_url: '/' + c.slug,
      scope: '/' + c.slug,
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: '#0b0d10',
      icons: [
        { src: '/icon-180.png', sizes: '180x180', type: 'image/png' },
        { src: '/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  } catch(e){}
}

].map(r => typeof r === 'string' ? TL_AUTO.find(a => a.k === r) : r);
const TL_NO_CARRY = new Set(['note','labs','pics','event']);

let LOGS = [];
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dOf = s => new Date(s + 'T12:00:00');
const addDays = (s, n) => { const d = dOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const todayIso = () => isoOf(new Date());
const mondayOf = s => { const d = dOf(s); return addDays(s, -((d.getDay() + 6) % 7)); };
const weeksBetween = (a, b) => Math.round((dOf(b) - dOf(a)) / 6048e5);
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const nf = (v, dp = 0) => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: dp, minimumFractionDigits: dp });
const isoWeek = s => { const d = dOf(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };

const logOf = (kind, day) => (LOGS.find(l => l.kind === kind && l.day === day) || {}).data || null;
const secs = () => (CLIENT && CLIENT.sections) || {};
const tlRows = () => {
  const r = secs().timeline_rows;
  return Array.isArray(r) && r.length ? r.map(x => x.k && x.k[0] === '_' ? (TL_AUTO.find(a => a.k === x.k) || x) : x) : TL_DEFAULT;
};
// A Timeline cell: typed for that week, or carried from the last week that had it.
function tlCell(mon, k){
  const own = logOf('target', mon);
  if(own && own[k] != null && own[k] !== '') return { v: own[k], carried: false };
  if(TL_NO_CARRY.has(k)) return { v: null };
  const prev = LOGS.filter(l => l.kind === 'target' && l.day < mon && l.data[k] != null && l.data[k] !== '')
    .sort((a, b) => a.day < b.day ? 1 : -1)[0];
  if(!prev) return { v: null };
  if(k === 'cycle' && num(prev.data.cycle) != null) return { v: num(prev.data.cycle) + weeksBetween(prev.day, mon), carried: true };
  return { v: prev.data[k], carried: true };
}
const tlNum = (mon, k) => num(tlCell(mon, k).v);
// What his page measures him against this week.
function targetFor(mon){
  const d = {};
  ['goal','note','event'].forEach(k => { const v = tlCell(mon, k).v; if(v != null) d[k] = v; });
  ['protein','carbs','fat','fiber','steps','cardio','kcal','target_bw'].forEach(k => { const v = tlNum(mon, k); if(v != null) d[k] = v; });
  const mac = secs().macros || {};
  ['protein','carbs','fat'].forEach(k => { if(d[k] == null && mac.on && mac[k] != null) d[k] = mac[k]; });
  if(d.protein != null && d.carbs != null && d.fat != null) d.kcal = (d.protein + d.carbs) * 4 + d.fat * 9;
  if(d.kcal == null && mac.on && mac.calories != null) d.kcal = mac.calories;
  return d;
}
const kcalOf = d => d.kcal != null ? num(d.kcal)
  : (d.protein != null && d.carbs != null && d.fat != null) ? (num(d.protein) + num(d.carbs)) * 4 + num(d.fat) * 9 : null;
function weekStats(mon){
  const days = [...Array(7)].map((_, i) => logOf('daily', addDays(mon, i))).filter(Boolean)
    .filter(d => DAILY_FIELDS.some(([k]) => d[k] != null) || d.notes);
  const a = k => avg(days.map(d => num(d[k])));
  return { n: days.length, weight: a('weight'), kcal: avg(days.map(kcalOf)), protein: a('protein'),
    carbs: a('carbs'), fat: a('fat'), fiber: a('fiber'), steps: a('steps'), sys: a('sys'), dia: a('dia'), pulse: a('pulse'),
    cardio: days.reduce((s, d) => s + (num(d.cardio) || 0), 0) };
}
const skinTotal = w => { if(!w) return null; const v = SKINFOLDS.map(([k]) => num(w[k])).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
function coachWeek(mon){
  const start = CLIENT.start_date || (CLIENT.phase || {}).start;
  if(!start) return null;
  const w = weeksBetween(mondayOf(start), mon) + 1;
  return w >= 1 ? w : null;
}

async function putLog(kind, day, data){

/* protocols: doses due on a day, and whether he ticked them off */
const activeProtocols = () => (secs().protocols || []).filter(p => p && p.on !== false && (p.name || '').trim());
const hasTrainingPlan = () => { const tp = secs().training_plan; return !!(tp && Array.isArray(tp.weeks) && tp.weeks.length && (tp.days || []).length); };
function protoWeek(p, day){
  if(!p.start) return 1;
  return Math.floor((dOf(day) - dOf(p.start)) / 6048e5) + 1;
}
// "1000" or one value per week "1000,1000,1500" (the last one holds after that).
function doseFor(it, wk){
  const parts = String(it.dose || '').split(',').map(s => s.trim()).filter(Boolean);
  if(!parts.length) return '';
  return parts[Math.max(0, Math.min(parts.length, wk) - 1)];
}
function dosesOn(day){
  const out = [];
  activeProtocols().filter(p => p.type === 'schedule').forEach(p => {
    const wk = protoWeek(p, day);
    if(wk < 1 || (p.weeks && wk > p.weeks)) return;
    const dow = (dOf(day).getDay() + 6) % 7;
    (p.items || []).forEach(it => {
      if(!(it.days || [])[dow] || !(it.name || '').trim()) return;
      out.push({ p, it, key: `p_${p.id}_${it.id}`, dose: doseFor(it, wk) });
    });
  });
  return out;
}
async function tickDose(day, key, on){
  const cur = Object.assign({}, logOf('daily', day) || {});
  if(on) cur[key] = true; else delete cur[key];
  await putLog('daily', day, cur);
}

    const lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
    const xy = pts.map((p, i) => `${(i / (pts.length - 1) * 296 + 2).toFixed(1)},${(50 - (p - lo) / span * 44).toFixed(1)}`);

      bs[i].textContent = v == null ? '—' : Math.round(v).toLocaleString('en-US') + u;
    });
  }
  // Today's doses from any schedule protocol, ticked off right here.
  const doses = dosesOn(today), dl = logOf('daily', today) || {};
  const doseHtml = doses.length ? `<div class="lbl grp" style="margin-top:18px" data-copy="trk_today_label">${esc(t('trk_today_label'))}</div>
    <div class="doses">${doses.map(x => `<label class="dose"><input type="checkbox" data-dk="${x.key}" ${dl[x.key] ? 'checked' : ''}>
      <span><b>${esc(x.it.name)}</b> ${esc([x.dose, x.it.unit].filter(Boolean).join(' '))}${x.it.note ? ` <small>· ${esc(x.it.note)}</small>` : ''}</span></label>`).join('')}</div>` : '';
  const doneWeekly = !!logOf('weekly', mon);
  $('#aWeek').innerHTML = `
    <div class="lbl" data-copy="trk_label">${esc(t('trk_label'))}</div>
    <div class="sub">${cw ? esc(t('trk_week', { n: cw })) + ' · ' : ''}${fmt(mon)} – ${fmt(addDays(mon, 6))}${tg.goal ? ' · ' + esc(tg.goal) : ''}</div>
    <div class="days">${strip}</div>
    <div class="stats4">
      ${stat(st.weight, 'Avg weight', delta != null ? (delta > 0 ? '+' : '') + nf(delta, 1) + ' vs last wk' : (tg.target_bw ? esc(t('trk_target', { n: nf(tg.target_bw, 1) })) : ''), 1)}
      ${stat(st.kcal, 'Avg kcals', tgt(tg.kcal))}
      ${stat(st.protein, 'Avg protein', tgt(tg.protein))}
      ${stat(st.steps, 'Avg steps', tgt(tg.steps))}
    </div>
    ${spark}
    ${tg.note ? `<p class="sub" style="margin-top:12px;color:var(--txt);white-space:pre-wrap">${esc(tg.note)}</p>` : ''}
    ${doseHtml}
    <div class="btns">
      <button class="btn" id="wLog" data-copy="${logOf('daily', today) ? 'trk_log_edit' : 'trk_log_btn'}">${esc(t(logOf('daily', today) ? 'trk_log_edit' : 'trk_log_btn'))}</button>

  document.querySelectorAll('#aWeek .days button').forEach(b => b.onclick = () => openDaily(b.dataset.day));
  document.querySelectorAll('#aWeek [data-dk]').forEach(cb => cb.onchange = async () => {

  };

// Phone photos are huge; shrink to 1600px JPEG before upload.
function shrink(file){
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => resolve(b ? new File([b], 'photo.jpg', { type:'image/jpeg' }) : file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function uploadPhoto(file){
  const fd = new FormData();
  fd.append('slug', SLUG); fd.append('pin', PIN); fd.append('file', await shrink(file));
  const res = await fetch(WORKER + '/client-log', { method:'POST', body: fd });
  const j = await res.json().catch(() => ({}));
  if(!res.ok || !j.url) throw new Error(j.error || 'Upload failed.');
  return j.url;
}

    <div class="fgrid">${MEASURES.map(([k, l]) => numIn(k, l)).join('')}</div>

async function saveLog(kind, day, data, btn, msg, stay){
  btn.disabled = true; btn.textContent = '…';
  try {
    await putLog(kind, day, data);
    msg.textContent = t('trk_saved');
    if(!stay) setTimeout(goBack, 650);
    return true;
  } catch(e){
    msg.textContent = e.message;
    return false;
  } finally {
    btn.disabled = false;
    btn.textContent = t(kind === 'weekly' ? 'trk_submit' : kind === 'training' ? 'trk_train_log' : 'trk_save');
  }
}

/* ── Timeline: the sheet's Timeline tab, read-only for him ─────────────── */
function tlValue(mon, row){
  const wk = logOf('weekly', mon);
  switch(row.k){
    case '_date': return fmt(mon);
    case '_woy': return isoWeek(mon);
    case '_woc': return coachWeek(mon) || '';
    case '_bw': { const s = weekStats(mon); return s.weight == null ? '' : nf(s.weight, 1); }
    case '_bp': { const s = weekStats(mon); return s.sys == null ? '' : nf(s.sys) + '/' + nf(s.dia); }
    case '_hr': { const s = weekStats(mon); return s.pulse == null ? '' : nf(s.pulse); }
    case '_sf': { const v = skinTotal(wk); return v == null ? '' : nf(v, 1); }
    case '_kcal': { const p = tlNum(mon, 'protein'), c = tlNum(mon, 'carbs'), f = tlNum(mon, 'fat');
      return (p != null && c != null && f != null) ? nf((p + c) * 4 + f * 9) : ''; }
    case '_mg': { const v = tlRows().filter(r => r.g === 'aas' && r.k[0] !== '_').map(r => parseFloat(tlCell(mon, r.k).v)).filter(x => !isNaN(x));
      return v.length ? nf(v.reduce((a, b) => a + b, 0)) : ''; }
  }
  if(row.k === 'pics' && wk && PICS.some(([k]) => wk[k])) return '✓';
  return tlCell(mon, row.k);
}
function timelineWeeks(){
  const now = mondayOf(todayIso());
  const start = CLIENT.start_date || (CLIENT.phase || {}).start;
  const firstT = LOGS.filter(l => l.kind === 'target').map(l => l.day).sort()[0];
  let from = start ? mondayOf(start) : (firstT || now);
  if(firstT && firstT < from) from = firstT;
  if(weeksBetween(from, now) > 40) from = addDays(now, -7 * 40);
  const lastT = LOGS.filter(l => l.kind === 'target').map(l => l.day).sort().pop();
  let to = addDays(now, 7 * 4);
  if(lastT && lastT > to) to = lastT;
  const out = []; for(let m = from; m <= to && out.length < 60; m = addDays(m, 7)) out.push(m);
  return out;
}
function openTimeline(){
  const weeks = timelineWeeks(), now = mondayOf(todayIso()), rows = tlRows();
  // A row with nothing in any week stays out of his view.
  const shown = rows.filter(r => r.k[0] === '_' || weeks.some(m => { const v = tlValue(m, r); return (v && typeof v === 'object' ? v.v : v) != null && (v && typeof v === 'object' ? v.v : v) !== ''; }));
  const cell = (m, r) => {
    const v = tlValue(m, r);
    if(v && typeof v === 'object') return v.v == null ? '' : `<span class="${v.carried ? 'carried' : ''}">${esc(v.v)}</span>`;
    return esc(v);
  };
  const body = TL_GROUPS.map(([g, gl]) => {
    const rs = shown.filter(r => r.g === g);
    if(!rs.length) return '';
    return (gl ? `<tr class="tlg"><th>${esc(gl)}</th>${weeks.map(m => `<td class="${m === now ? 'now' : ''}"></td>`).join('')}</tr>` : '') +
      rs.map(r => `<tr><th>${esc(r.l)}</th>${weeks.map(m => `<td class="${m === now ? 'now' : ''}">${cell(m, r)}</td>`).join('')}</tr>`).join('');
  }).join('');
  showSection(`
    <h1 data-copy="tile_timeline">${esc(t('tile_timeline'))}</h1>
    <div class="tlwrap" id="tlWrap"><table class="tl"><tbody>${body}</tbody></table></div>
    <p class="updated">This week is highlighted. Grey values carry on from an earlier week.</p>`);
  const nowCell = document.querySelector('#tlWrap td.now');
  if(nowCell) $('#tlWrap').scrollLeft = Math.max(0, nowCell.offsetLeft - 160);
}

/* ── Training: the program week by week, and a log of each session ─────── */
function trainingWeekIndex(tp){
  if(!tp.start) return 0;
  const i = Math.floor((dOf(todayIso()) - dOf(mondayOf(tp.start))) / 6048e5);
  return Math.max(0, Math.min(tp.weeks.length - 1, i));
}
function openTraining(wi){
  const tp = secs().training_plan;
  if(wi == null) wi = trainingWeekIndex(tp);
  const wk = tp.weeks[wi] || { ex: [] };
  const total = (wk.ex || []).reduce((s, d) => s + (d || []).reduce((a, e) => a + (num(e.s) || 0), 0), 0);
  showSection(`
    <h1 data-copy="tile_training">${esc(t('tile_training'))}</h1>
    <div class="wtabs">${tp.weeks.map((w, i) => `<button data-wi="${i}" class="${i === wi ? 'on' : ''}">${esc(w.label || 'W' + (i + 1))}</button>`).join('')}</div>
    <p class="sub" style="margin:0 0 14px">${nf(total)} total sets this week</p>
    ${tp.days.map((day, di) => {
      const ex = (wk.ex || [])[di] || [];
      const sets = ex.reduce((a, e) => a + (num(e.s) || 0), 0);
      return `<div class="card tday">
        <div class="tdh"><div><b>${esc(day.name || 'Day ' + (di + 1))}</b>${day.when ? ` <span class="sub">· ${esc(day.when)}</span>` : ''}</div><span class="sub">${nf(sets)} sets</span></div>
        <ol class="exl">${ex.map(e => `<li><span>${esc(e.n)}</span><span class="sub">${e.s != null ? esc(e.s) + ' sets' : ''}${e.r ? ' · ' + esc(e.r) : ''}</span></li>`).join('')}</ol>
        ${ex.length ? `<button class="btn ghost sm" data-log="${di}" data-copy="trk_train_log">${esc(t('trk_train_log'))}</button>` : ''}
      </div>`;
    }).join('')}
    ${tp.notes ? `<div class="body" style="margin-top:8px">${render(tp.notes)}</div>` : ''}`);
  document.querySelectorAll('#aSection .wtabs button').forEach(b => b.onclick = () => openTraining(+b.dataset.wi));
  document.querySelectorAll('#aSection [data-log]').forEach(b => b.onclick = () => openSession(wi, +b.dataset.log, todayIso()));
}
// The last time he logged an exercise with this name — what to beat.
function lastFor(name, before){
  const ls = LOGS.filter(l => l.kind === 'training' && l.day < before).sort((a, b) => a.day < b.day ? 1 : -1);
  for(const l of ls){
    for(let i = 0; i < 40; i++){
      if(l.data['e' + i + 'n'] === name && (l.data['e' + i + 'w'] || l.data['e' + i + 'r'])) return { day: l.day, w: l.data['e' + i + 'w'], r: l.data['e' + i + 'r'] };
    }
  }
  return null;
}
function openSession(wi, di, day){
  const tp = secs().training_plan, day0 = tp.days[di] || {};
  const ex = ((tp.weeks[wi] || {}).ex || [])[di] || [];
  const saved = logOf('training', day);
  const same = saved && saved.d === di && saved.wk === wi;
  showSection(`
    <h1>${esc(day0.name || 'Session')}</h1>
    <div class="dnav"><button id="sPrev" aria-label="Previous day">‹</button><b>${dayLabel(day)}</b>
      <button id="sNext" aria-label="Next day" ${day >= todayIso() ? 'disabled' : ''}>›</button></div>
    ${ex.map((e, i) => {
      const last = lastFor(e.n, day);
      const w = same ? saved['e' + i + 'w'] : '', r = same ? saved['e' + i + 'r'] : '';
      return `<div class="q exlog"><p class="qt">${esc(e.n)} <span class="sub">${e.s != null ? '· ' + esc(e.s) + ' sets' : ''}${e.r ? ' · ' + esc(e.r) : ''}</span></p>
        ${last ? `<p class="qh">Last time (${fmt(last.day)}): ${esc([last.w, last.r].filter(Boolean).join(' × '))}</p>` : ''}
        <div class="fgrid"><div class="f"><label>Weight</label><input data-i="${i}" data-f="w" value="${esc(w || '')}" placeholder="e.g. 140"></div>
        <div class="f"><label>Reps per set</label><input data-i="${i}" data-f="r" value="${esc(r || '')}" placeholder="e.g. 20,14,15,13"></div></div></div>`;
    }).join('')}
    <div class="f"><label for="s_notes">Notes</label><textarea id="s_notes">${esc(same ? saved.notes || '' : '')}</textarea></div>
    <button class="btn" id="sSave" data-copy="trk_train_log">${esc(t('trk_train_log'))}</button>
    <p class="saved" id="sMsg"></p>`);
  $('#sBack').onclick = () => openTraining(wi);
  $('#sPrev').onclick = () => openSession(wi, di, addDays(day, -1));
  $('#sNext').onclick = () => openSession(wi, di, addDays(day, 1));
  $('#sSave').onclick = async () => {
    const data = { d: di, wk: wi, day: day0.name || '' };
    ex.forEach((e, i) => { data['e' + i + 'n'] = e.n; });
    document.querySelectorAll('#aSection [data-f]').forEach(inp => { const v = inp.value.trim(); if(v) data['e' + inp.dataset.i + inp.dataset.f] = v; });
    const n = $('#s_notes').value.trim(); if(n) data.notes = n;
    if(await saveLog('training', day, data, $('#sSave'), $('#sMsg'), true)) setTimeout(() => openTraining(wi), 650);
  };
}

/* ── Protocols: dosing schedules, tables (peak week), written protocols ── */
function openProtocol(pid, mon){
  const p = activeProtocols().find(x => x.id === pid);
  if(!p) return;
  let body = '';
  if(p.type === 'schedule'){
    mon = mon || mondayOf(todayIso());
    const wk = protoWeek(p, mon), dn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], today = todayIso();
    const live = wk >= 1 && !(p.weeks && wk > p.weeks);
    body = `<div class="dnav"><button id="pPrev">‹</button><b>${live ? 'Week ' + wk + (p.weeks ? ' of ' + p.weeks : '') + ' · ' : ''}${fmt(mon)} – ${fmt(addDays(mon, 6))}</b><button id="pNext">›</button></div>
      ${live ? [...Array(7)].map((_, i) => {
        const day = addDays(mon, i), due = dosesOn(day).filter(x => x.p.id === p.id), dl = logOf('daily', day) || {};
        return `<div class="pday ${day === today ? 'now' : ''}"><div class="pdh">${dn[i]} <span class="sub">${fmt(day)}</span></div>
          ${due.length ? due.map(x => `<label class="dose"><input type="checkbox" data-day="${day}" data-dk="${x.key}" ${dl[x.key] ? 'checked' : ''} ${day > today ? 'disabled' : ''}>
            <span><b>${esc(x.it.name)}</b> ${esc([x.dose, x.it.unit].filter(Boolean).join(' '))}${x.it.note ? ` <small>· ${esc(x.it.note)}</small>` : ''}</span></label>`).join('')
            : '<p class="sub" style="margin:2px 0 0">Nothing today</p>'}</div>`;
      }).join('') : `<div class="card" style="color:var(--mut)">${wk < 1 ? 'Starts ' + fmt(p.start) + '.' : 'This protocol has finished.'}</div>`}`;
  } else if(p.type === 'table'){
    const cols = p.cols || [];
    body = `<div class="card" style="padding:14px 12px"><div class="histwrap"><table class="hist ptab">
      <thead><tr><th></th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${(p.rows || []).map(r => `<tr><td><b>${esc(r.label)}</b></td>${cols.map((_, i) => `<td>${esc((r.cells || [])[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }
  showSection(`<h1>${esc(p.name)}</h1>${body}${(p.text || '').trim() ? `<div class="body" style="margin-top:16px">${render(p.text)}</div>` : ''}`);
  if(p.type === 'schedule'){
    $('#pPrev').onclick = () => openProtocol(pid, addDays(mon, -7));
    $('#pNext').onclick = () => openProtocol(pid, addDays(mon, 7));
    document.querySelectorAll('#aSection [data-dk]').forEach(cb => cb.onchange = async () => {
      cb.disabled = true;
      try { await tickDose(cb.dataset.day, cb.dataset.dk, cb.checked); } catch(e){ cb.checked = !cb.checked; alert(e.message); }
      cb.disabled = false;
    });
  }
}

/* ── edit mode: trt-guy.com/<anyone>?edit=1 ───────────────────────────────
   Click any dashed word and type over it. It edits the wording for EVERY
   client's page — never the client's own plan, which lives in the manager.
   Placeholders are shown raw ({first}, {n}) so they survive an edit. */
const EDIT = new URLSearchParams(location.search).get('edit') === '1';
const CCKEY = 'tg-clients-key';

function startEdit(){
  let key = localStorage.getItem(CCKEY);
  if(!key){
    key = prompt('Passcode to edit the wording:');
    if(!key) return;
    localStorage.setItem(CCKEY, key);
  }
  document.body.classList.add('tg-edit');
  document.querySelectorAll('details').forEach(d => {
    d.open = true;
    const sum = d.querySelector('summary');
    if(sum) sum.addEventListener('click', e => e.preventDefault());
  });
  markEditable();
  const bar = document.createElement('div');
  bar.className = 'editbar';
  bar.innerHTML = `<span>Click any dashed text and type over it</span>
    <button id="eReset">Reset all</button>
    <button id="eExit">Exit</button>
    <button class="go" id="eSave">Save</button>`;
  document.body.appendChild(bar);
  bar.querySelector('#eSave').onclick = saveEdits;
  bar.querySelector('#eExit').onclick = () => { location.search = ''; };
  bar.querySelector('#eReset').onclick = async () => {
    if(!confirm('Put every line back to its default wording?')) return;
    C = Object.assign({}, DEFAULT_COPY);
    await pushCopy({});
    location.reload();
  };
}

// Show the raw wording (with its {placeholders}) so editing can't eat them.
function markEditable(){
  document.querySelectorAll('[data-copy]').forEach(el => {
    const k = el.getAttribute('data-copy');
    if(!(k in DEFAULT_COPY)) return;
    el.textContent = (C[k] == null || C[k] === '') ? DEFAULT_COPY[k] : C[k];
    el.contentEditable = 'true';
    el.spellcheck = false;
  });
}

async function pushCopy(copy){
  const res = await fetch(WORKER + '/clients', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CC-Key': localStorage.getItem(CCKEY) || '' },
    body: JSON.stringify({ action: 'copy_save', copy }),
  });
  if(res.status === 401){ localStorage.removeItem(CCKEY); throw new Error('Wrong passcode — reload and try again.'); }
  if(!res.ok) throw new Error('Save failed (' + res.status + ')');
}

async function saveEdits(){
  const out = {};
  document.querySelectorAll('[data-copy]').forEach(el => {
    const k = el.getAttribute('data-copy');
    if(!(k in DEFAULT_COPY)) return;
    const v = el.textContent.replace(/\s+/g, ' ').trim();
    if(v && v !== DEFAULT_COPY[k]) out[k] = v;
  });
  // Anything not on screen right now keeps whatever it already had.
  Object.keys(C).forEach(k => {
    if(!(k in out) && C[k] && C[k] !== DEFAULT_COPY[k] && !document.querySelector(`[data-copy="${k}"]`)) out[k] = C[k];
  });
  const btn = document.querySelector('#eSave');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await pushCopy(out);
    C = Object.assign({}, DEFAULT_COPY, out);
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Save'; }, 1400);
  } catch(e){
    alert(e.message);
    btn.disabled = false; btn.textContent = 'Save';
  }
}

boot();
</script>
