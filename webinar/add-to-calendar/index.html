<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add It To Your Calendar — TRT Guy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0d10;--txt:#1b1f24;--mut:#5b6572;--line:rgba(11,13,16,.14);
    --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--ink);color:#fff;line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}
  .shell{max-width:560px;margin:0 auto;padding:0 22px;width:100%}
  .bar{border-bottom:1px solid rgba(255,255,255,.1)}
  .bar .shell{display:flex;justify-content:center;padding-top:22px;padding-bottom:22px;max-width:1080px}
  .wordmark{display:block;width:150px;height:50px;background:url("/img/logo-white.png") center/contain no-repeat;font-size:0;color:transparent;overflow:hidden}
  .wrap{flex:1;padding:46px 0 70px;text-align:center}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6.4vw,44px);line-height:1.04;text-transform:uppercase;margin-bottom:10px}
  .ev{color:#c3c9d2;font-size:17px;margin-bottom:6px}
  .when{color:#fff;font-weight:600;font-size:17px;margin-bottom:30px}
  a.btn{display:block;background:#fff;color:var(--ink);text-decoration:none;border-radius:10px;padding:16px 18px;margin-bottom:11px;
    font-weight:600;font-size:15px}
  a.btn:hover{background:#e8ebf0}
  a.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
  a.btn.ghost:hover{background:rgba(255,255,255,.08)}
  .note{color:#8d96a3;font-size:13px;margin-top:20px}
  @media (max-width:560px){.shell{padding:0 17px}.wordmark{width:124px;height:42px}.wrap{padding:34px 0 54px}}
</style>
</head>
<body>

<header class="bar">
  <div class="shell"><a class="wordmark" href="/">TRT-GUY</a></div>
</header>

<div class="shell wrap">
  <h1>Add It To Your Calendar</h1>
  <p class="ev" id="evTitle">7 Steps To Build Muscle And Get Shredded On TRT</p>
  <p class="when" id="evWhen">Wed, Oct 28 2026</p>

  <a class="btn" id="bGoogle" href="#">Google Calendar</a>
  <a class="btn" id="bIcs" href="#">Apple Calendar or Outlook</a>
  <a class="btn ghost" href="/webinar/">Back to the event page</a>

  <p class="note">The second one downloads a file — open it and your calendar will add the event.</p>
</div>

<script>
(function () {
  var API = 'https://trt-guy-onboarding.julianhierro.workers.dev';
  var w = new URLSearchParams(location.search).get('w') || 'trt-oct';
  document.getElementById('bGoogle').href = API + '/webinar-cal?w=' + encodeURIComponent(w);
  document.getElementById('bIcs').href = API + '/webinar.ics?w=' + encodeURIComponent(w);

  // The date comes from the .ics so this page can never disagree with the invite.
  fetch(API + '/webinar.ics?w=' + encodeURIComponent(w)).then(function (r) { return r.text(); }).then(function (t) {
    var m = /DTSTART:(\d{8})T(\d{6})Z/.exec(t);
    var s = /SUMMARY:(.*)/.exec(t);
    if (s) document.getElementById('evTitle').textContent = s[1].trim();
    if (!m) return;
    var d = new Date(Date.UTC(+m[1].slice(0,4), +m[1].slice(4,6) - 1, +m[1].slice(6,8),
                              +m[2].slice(0,2), +m[2].slice(2,4)));
    document.getElementById('evWhen').textContent = new Intl.DateTimeFormat('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }).format(d);
  }).catch(function () {});
})();
</script>
</body>
</html>
