<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT Guy — TRT 101 Guide + Coaching</title>
<meta property="og:title" content="TRT Guy — TRT 101 Guide + Coaching">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trt-guy.com/start/">
<meta property="og:image" content="https://trt-guy.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TRT Guy — TRT 101 Guide + Coaching">
<meta name="twitter:image" content="https://trt-guy.com/og-image.png">
<style>
  :root{--acc:#1a5cff;--line:rgba(11,13,16,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff}
  .tabbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
  .tabbar button{background:#eef1f6;border:1px solid var(--line);border-radius:10px;padding:10px 18px;font:700 14px/1 "Inter",sans-serif;color:#5b6572;cursor:pointer;transition:all .15s}
  .tabbar button.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .frame{width:100%;border:0;display:none;background:#fff}
  .frame.on{display:block}
</style>
</head>
<body>
  <div class="tabbar">
    <button type="button" data-t="guide" class="active">TRT 101 Guide</button>
    <button type="button" data-t="waitlist">Coaching Waitlist</button>
  </div>
  <iframe class="frame on" id="f-guide" src="https://trt-guy.com/trt-101-guide/get/" title="TRT 101 Guide"></iframe>
  <iframe class="frame" id="f-waitlist" src="https://trt-guy.com/waitlist/" title="Coaching Waitlist"></iframe>

<script>
// simple view beacon
try{ if(navigator.sendBeacon) navigator.sendBeacon('https://jv-dashboard-chi.vercel.app/api/pageview?p=trtguy-start&e=view&v='+(localStorage.getItem('tg-vid')||'anon')); }catch(e){}
// size the iframe to fill the screen under the tab bar
function fit(){ var h=window.innerHeight - document.querySelector('.tabbar').offsetHeight; document.querySelectorAll('.frame').forEach(function(f){f.style.height=h+'px';}); }
window.addEventListener('resize',fit); fit();
// tabs
document.querySelector('.tabbar').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('.tabbar button').forEach(function(x){x.classList.toggle('active',x===b);});
  document.querySelectorAll('.frame').forEach(function(f){f.classList.toggle('on', f.id==='f-'+b.dataset.t);});
});
</script>
</body>
</html>
